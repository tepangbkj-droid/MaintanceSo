name: Unduh vendor (React, Lucide, QR, font)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Unduh library ke folder vendor/
        run: node scripts/vendor-libs.mjs
      - name: Commit hasilnya
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor
          git commit -m "Tambah folder vendor (React, ReactDOM, Lucide, QR, font)" || echo "Tidak ada perubahan"
          git push
          
