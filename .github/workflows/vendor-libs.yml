name: Unduh vendor (React, Lucide, QR, font)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Unduh library ke folder vendor/
        run: node scripts/vendor-libs.mjs
      - name: Commit hasilnya
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vendor
          git commit -m "Tambah folder vendor (React, ReactDOM, Lucide, QR, font)" || echo "Tidak ada perubahan"
          git push
          
