      const loadTests = async () => {
        setLoading(true);
        setLoadError('');
        try {
          const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests`, { headers: __authHeaders() });
          const data = await res.json().catch(() => ({}));
          if (res.ok) { setTests(data.tests || []); }
          else { setLoadError(data.error || `Gagal memuat paket psikotes (status ${res.status}).`); }
        } catch (err) {
          // Biasanya fetch gagal total (bukan cuma respons error) kalau koneksi terputus atau
          // origin APK belum diizinkan di pengaturan CORS server (ALLOWED_ORIGIN).
          setLoadError('Gagal terhubung ke server. Periksa koneksi internet, atau hubungi admin teknis kalau ini terjadi terus-menerus di aplikasi APK.');
        } finally { setLoading(false); }
      };
      useEffect(() => { loadTests(); }, []);

      const handleCreate = async () => {
        if (!newTitle.trim()) return;
        setCreating(true);
        setCreateError('');
        try {
          const timerVal = newTimer ? parseInt(newTimer) || null : null;
          const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
            body: JSON.stringify({ title: newTitle.trim(), description: newDesc.trim(), timer_minutes: timerVal }),
          });
          if (res.ok) {
            const data = await res.json().catch(() => ({}));
            setNewTitle(''); setNewDesc(''); setNewTimer(''); setShowCreate(false);
            await loadTests();
            // Buat short link otomatis untuk paket baru
            if (data.linkToken) {
              const target = `${PUBLIC_APP_BASE}/psikotes.html?psikotes=${data.linkToken}`;
              await __apiFetch(`${WORKER_BASE}/api/psikotes/short-links`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
                body: JSON.stringify({ target_url: target }),
              }).catch(() => {});
            }
            return;
          }
          const data = await res.json().catch(() => ({}));
          setCreateError(data.error || `Gagal membuat paket psikotes (status ${res.status}).`);
        } catch (err) {
          setCreateError('Gagal terhubung ke server. Periksa koneksi internet lalu coba lagi.');
        } finally { setCreating(false); }
      };

      const toggleLock = async (test) => {
        await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}/lock`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
          body: JSON.stringify({ locked: !test.locked }),
        });
        loadTests();
      };

      const handleDelete = async (test) => {
        if (!window.confirm(`Hapus paket psikotes "${test.title}"? Semua soal & hasil OJT ikut terhapus.`)) return;
        await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}`, { method: 'DELETE', headers: __authHeaders() });
        loadTests();
      };

      const copyLink = async (test) => {
        // Coba ambil short link yang sudah pernah dibuat untuk test ini
        let link = `${PUBLIC_APP_BASE}/psikotes.html?psikotes=${test.link_token}`;
        try {
          const slRes = await __apiFetch(`${WORKER_BASE}/api/psikotes/short-links?token=${test.link_token}`, { headers: __authHeaders() });
          const slData = await slRes.json().catch(() => ({}));
          if (slRes.ok && slData.links && slData.links.length > 0) {
            link = `${PUBLIC_APP_BASE}/s/${slData.links[0].slug}`;
          } else {
            // Buat short link baru kalau belum ada
            const mkRes = await __apiFetch(`${WORKER_BASE}/api/psikotes/short-links`, {
              method: 'POST', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
              body: JSON.stringify({ target_url: link }),
            });
            const mkData = await mkRes.json().catch(() => ({}));
            if (mkRes.ok && mkData.slug) link = `${PUBLIC_APP_BASE}/s/${mkData.slug}`;
          }
        } catch (e) { /* fallback ke link panjang */ }
        // BUGFIX: navigator.clipboard bisa TIDAK ADA / ditolak diam-diam di sebagian WebView APK
        // (Capacitor) kalau permission clipboard belum diberikan atau API-nya tidak didukung --
        // sebelumnya ini bisa melempar error tak tertangani saat tombol "Salin Link" ditekan.
        // Sekarang: coba Clipboard API dulu, kalau tidak tersedia/gagal, pakai fallback
        // textarea+execCommand (didukung hampir semua WebView lama).
        const markCopied = () => { setLinkCopied(test.id); setTimeout(() => setLinkCopied(null), 2000); };
        const fallbackCopy = () => {
          try {
            const ta = document.createElement('textarea');
            ta.value = link;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            markCopied();
          } catch (err) {
            window.prompt('Salin link ini secara manual:', link);
          }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(markCopied).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
      };

      if (editingTest) {
        return <PsikotesQuestionEditor test={editingTest} onBack={() => { setEditingTest(null); loadTests(); }} />;
      }
      if (viewingScores) {
        return <PsikotesScoresView test={viewingScores} stores={stores} onBack={() => setViewingScores(null)} />;
      }

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="font-bold text-slate-700 text-base">Psikotes OJT</h2>
            <button onClick={() => setShowCreate(true)} className="flex items-center gap-1.5 bg-purple-800 hover:bg-purple-900 text-white text-xs font-bold px-3 py-2 rounded-xl">
              <i data-lucide="plus" className="w-3.5 h-3.5"></i> Buat Psikotes
            </button>
          </div>
          <p className="text-xs text-slate-500">Buat paket soal evaluasi untuk anak OJT, bagikan link-nya, lalu pantau hasilnya di sini. OJT yang keluar dari halaman saat mengerjakan otomatis terblokir sampai kamu buka blokirnya.</p>

          {showCreate && (
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
              <input value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="Judul, mis. SOP Produksi Roti Taro" className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" />
              <textarea value={newDesc} onChange={e => setNewDesc(e.target.value)} placeholder="Deskripsi singkat (opsional)" rows={2} className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" />
              <div>
                <label className="text-xs font-semibold text-slate-500 block mb-1">Timer Pengerjaan <span className="text-slate-400 font-normal">(opsional — kosongkan jika tidak pakai timer)</span></label>
                <div className="flex items-center gap-2">
                  <input type="number" min="1" max="300" value={newTimer} onChange={e => setNewTimer(e.target.value)} placeholder="mis. 30" className="w-28 border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                  <span className="text-xs text-slate-500">menit</span>
                </div>
              </div>
              {createError && <p className="text-xs text-rose-600 font-semibold">{createError}</p>}
              <div className="flex gap-2">
                <button onClick={() => setShowCreate(false)} className="flex-1 border border-slate-200 text-slate-600 text-sm font-semibold py-2 rounded-xl">Batal</button>
                <button onClick={handleCreate} disabled={creating || !newTitle.trim()} className="flex-1 bg-purple-800 hover:bg-purple-900 disabled:opacity-50 text-white text-sm font-bold py-2 rounded-xl">{creating ? 'Menyimpan...' : 'Simpan'}</button>
              </div>
            </div>
          )}

          {loading ? (
            <div className="text-center text-slate-400 text-sm py-8"><i data-lucide="loader" className="w-6 h-6 animate-spin mx-auto"></i></div>
          ) : loadError ? (
            <div className="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center space-y-3">
              <i data-lucide="alert-triangle" className="w-6 h-6 text-rose-500 mx-auto"></i>
              <p className="text-xs text-rose-700 font-semibold">{loadError}</p>
              <button onClick={loadTests} className="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-xl">Coba Lagi</button>
            </div>
          ) : tests.length === 0 ? (
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-10 text-center text-slate-500 text-sm">Belum ada paket psikotes. Klik "Buat Psikotes" untuk mulai.</div>
          ) : (
            <div className="space-y-3">
              {tests.map(test => (
                <div key={test.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <h3 className="font-bold text-slate-800 text-sm">{test.title}</h3>
                      {test.description && <p className="text-xs text-slate-500 mt-0.5">{test.description}</p>}
                      <div className="flex items-center gap-2 mt-1.5 text-[11px] text-slate-400 flex-wrap">
                        <span>{test.question_count} soal</span>
                        <span>•</span>
                        <span>{test.attempt_count} OJT sudah isi</span>
                        {test.timer_minutes && <span className="text-indigo-600">• <i data-lucide="timer" className="w-3 h-3 inline-block -mt-0.5"></i> {test.timer_minutes} mnt</span>}
                        {test.blocked_count > 0 && <span className="text-rose-600 font-semibold">• {test.blocked_count} diblokir</span>}
                      </div>
                    </div>
                    {test.locked ? (
                      <span className="text-[10px] bg-amber-100 text-amber-700 font-bold px-2 py-1 rounded-md flex items-center gap-1"><i data-lucide="lock" className="w-3 h-3"></i>Terkunci</span>
                    ) : (
                      <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-1 rounded-md">Aktif</span>
                    )}
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => setEditingTest({ id: test.id, title: test.title })} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700">Kelola Soal</button>
                    <button onClick={() => setViewingScores({ id: test.id, title: test.title })} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700">Lihat Hasil</button>
                    <button onClick={() => copyLink(test)} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700">{linkCopied === test.id ? 'Tersalin!' : 'Salin Link'}</button>
                    <button onClick={() => toggleLock(test)} className={`text-xs font-semibold px-3 py-1.5 rounded-lg ${test.locked ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>{test.locked ? 'Buka Kunci' : 'Kunci'}</button>
                    <button onClick={() => handleDelete(test)} className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 ml-auto">Hapus</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // Editor soal untuk satu paket psikotes (tipe pilihan_ganda / esai).
    function PsikotesQuestionEditor({ test, onBack }) {
      const [questions, setQuestions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState('');
      const [saving, setSaving] = useState(false);
      const [saveError, setSaveError] = useState('');

      useEffect(() => {
        (async () => {
          try {
            const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}/questions`, { headers: __authHeaders() });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
              setQuestions((data.questions || []).length ? data.questions.map(q => ({ type: q.question_type, text: q.question_text, options: q.options && q.options.length ? q.options : ['', ''], correctIndex: q.correct_index, image_url: q.image_url || null })) : []);
            } else {
              // BUGFIX: sebelumnya kalau gagal memuat (mis. tabel D1 belum dibuat), halaman ini
              // crash diam-diam (mencoba baca data.questions.length padahal data.questions
              // tidak ada) atau cuma menampilkan daftar kosong tanpa keterangan.
              setLoadError(data.error || `Gagal memuat soal (status ${res.status}).`);
            }
          } catch (err) {
            setLoadError('Gagal terhubung ke server. Periksa koneksi internet lalu coba lagi.');
          } finally { setLoading(false); }
        })();
      }, [test.id]);

      const [uploadingImg, setUploadingImg] = useState(null); // index soal yang sedang upload gambar

      const addQuestion = (type) => {
        setQuestions(prev => [...prev, type === 'esai' ? { type: 'esai', text: '', image_url: null } : { type: 'pilihan_ganda', text: '', options: ['', ''], correctIndex: 0, image_url: null }]);
      };
      const updateQuestion = (i, patch) => setQuestions(prev => prev.map((q, idx) => idx === i ? { ...q, ...patch } : q));
      const removeQuestion = (i) => setQuestions(prev => prev.filter((_, idx) => idx !== i));
      const updateOption = (qi, oi, value) => setQuestions(prev => prev.map((q, idx) => idx === qi ? { ...q, options: q.options.map((o, j) => j === oi ? value : o) } : q));
      const addOption = (qi) => setQuestions(prev => prev.map((q, idx) => idx === qi ? { ...q, options: [...q.options, ''] } : q));
      const removeOption = (qi, oi) => setQuestions(prev => prev.map((q, idx) => idx === qi ? { ...q, options: q.options.filter((_, j) => j !== oi), correctIndex: q.correctIndex >= q.options.length - 1 ? 0 : q.correctIndex } : q));

      const handleImageUpload = async (qi, file) => {
        if (!file) return;
        const ALLOWED = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
        if (!ALLOWED.includes(file.type)) { alert('Hanya gambar JPG/PNG/WEBP/GIF yang diizinkan.'); return; }
        if (file.size > 5 * 1024 * 1024) { alert('Gambar maksimal 5 MB.'); return; }
        setUploadingImg(qi);
        try {
          const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
          const res = await __apiFetch(`${WORKER_BASE}/api/media/upload?folder=psikotes-questions&ext=${ext}`, {
            method: 'POST',
            headers: { 'Content-Type': file.type, ...__authHeaders() },
            body: file,
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.key) {
            updateQuestion(qi, { image_url: data.key });
          } else {
            alert(data.error || 'Gagal upload gambar.');
          }
        } catch (e) {
          alert('Gagal upload gambar. Periksa koneksi internet.');
        } finally { setUploadingImg(null); }
      };

      const removeImage = (qi) => updateQuestion(qi, { image_url: null });

      const handleSave = async () => {
        setSaving(true);
        setSaveError('');
        try {
          const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}/questions`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
            body: JSON.stringify({ questions }),
          });
          if (res.ok) { onBack(); return; }
          // BUGFIX UTAMA: sebelumnya kalau res.ok false (mis. "no such table: psikotes_questions"
          // karena tabelnya belum dibuat di D1), TIDAK ADA APA-APA yang terjadi -- tombol
          // cuma balik jadi "Simpan Semua Soal" lagi tanpa keterangan, persis seperti "soal
          // tidak bisa disimpan" yang dilaporkan. Sekarang error server ditampilkan jelas.
          const data = await res.json().catch(() => ({}));
          setSaveError(data.error || `Gagal menyimpan soal (status ${res.status}). Kalau ini terus terjadi, kemungkinan tabel psikotes di database (D1) belum dibuat -- hubungi admin teknis.`);
        } catch (err) {
          setSaveError('Gagal terhubung ke server. Periksa koneksi internet lalu coba lagi.');
        } finally { setSaving(false); }
      };

      if (loading) return <div className="text-center text-slate-400 text-sm py-8"><i data-lucide="loader" className="w-6 h-6 animate-spin mx-auto"></i></div>;

      if (loadError) {
        return (
          <div className="max-w-2xl mx-auto space-y-4">
            <div className="flex items-center gap-2">
              <button onClick={onBack} className="p-2 rounded-lg hover:bg-slate-100"><i data-lucide="arrow-left" className="w-4 h-4"></i></button>
              <h2 className="font-bold text-slate-700 text-base">Kelola Soal — {test.title}</h2>
            </div>
            <div className="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center space-y-2">
              <i data-lucide="alert-triangle" className="w-6 h-6 text-rose-500 mx-auto"></i>
              <p className="text-xs text-rose-700 font-semibold">{loadError}</p>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <div className="flex items-center gap-2">
            <button onClick={onBack} className="p-2 rounded-lg hover:bg-slate-100"><i data-lucide="arrow-left" className="w-4 h-4"></i></button>
            <h2 className="font-bold text-slate-700 text-base">Kelola Soal — {test.title}</h2>
          </div>

          <div className="space-y-3">
            {questions.map((q, qi) => (
              <div key={qi} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-400">Soal {qi + 1} • {q.type === 'esai' ? 'Esai' : 'Pilihan Ganda'}</span>
                  <button onClick={() => removeQuestion(qi)} className="text-rose-500 text-xs font-semibold">Hapus</button>
                </div>
                <textarea value={q.text} onChange={e => updateQuestion(qi, { text: e.target.value })} rows={2} placeholder="Tulis pertanyaan..." className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" />
                {/* Gambar soal (opsional) */}
                <div className="space-y-1.5">
                  {q.image_url ? (
                    <div className="relative inline-block">
                      <img src={`${WORKER_BASE}/api/media/file/${q.image_url}`} alt="Gambar soal" className="max-h-40 rounded-xl border border-slate-200 object-cover" />
                      <button onClick={() => removeImage(qi)} className="absolute top-1 right-1 bg-rose-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold hover:bg-rose-600" title="Hapus gambar"><i data-lucide="x" className="w-3 h-3"></i></button>
                    </div>
                  ) : (
                    <label className={`inline-flex items-center gap-1.5 text-[11px] font-semibold cursor-pointer px-3 py-1.5 rounded-lg border border-dashed border-slate-300 text-slate-500 hover:bg-slate-50 ${uploadingImg === qi ? 'opacity-50 pointer-events-none' : ''}`}>
                      <i data-lucide="image-plus" className="w-3.5 h-3.5"></i>
                      {uploadingImg === qi ? 'Mengupload...' : 'Sisipkan Gambar'}
                      <input type="file" accept="image/*" className="hidden" onChange={e => handleImageUpload(qi, e.target.files[0])} disabled={uploadingImg !== null} />
                    </label>
                  )}
                </div>
                {q.type === 'pilihan_ganda' && (
                  <div className="space-y-1.5">
                    {q.options.map((opt, oi) => (
                      <div key={oi} className="flex items-center gap-2">
                        <input type="radio" checked={q.correctIndex === oi} onChange={() => updateQuestion(qi, { correctIndex: oi })} title="Tandai sebagai jawaban benar" />
                        <input value={opt} onChange={e => updateOption(qi, oi, e.target.value)} placeholder={`Pilihan ${oi + 1}`} className="flex-1 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs" />
                        {q.options.length > 2 && <button onClick={() => removeOption(qi, oi)} className="text-slate-400"><i data-lucide="x" className="w-3.5 h-3.5"></i></button>}
                      </div>
                    ))}
                    <button onClick={() => addOption(qi)} className="text-[11px] font-semibold text-purple-700">+ Tambah pilihan</button>
                    <p className="text-[10px] text-slate-400">Klik bulatan di samping pilihan untuk menandai jawaban yang benar.</p>
                  </div>
                )}
              </div>
            ))}
          </div>

          <div className="flex gap-2">
            <button onClick={() => addQuestion('pilihan_ganda')} className="flex-1 border border-dashed border-slate-300 text-slate-600 text-xs font-semibold py-2.5 rounded-xl">+ Soal Pilihan Ganda</button>
            <button onClick={() => addQuestion('esai')} className="flex-1 border border-dashed border-slate-300 text-slate-600 text-xs font-semibold py-2.5 rounded-xl">+ Soal Esai</button>
          </div>

          {saveError && <p className="text-xs text-rose-600 font-semibold text-center">{saveError}</p>}
          <button onClick={handleSave} disabled={saving} className="w-full bg-purple-800 hover:bg-purple-900 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm">
            {saving ? 'Menyimpan...' : 'Simpan Semua Soal'}
          </button>
        </div>
      );
    }

    // Daftar hasil/skor OJT untuk satu paket psikotes, dengan tombol buka blokir.
    // Juga berisi bagian "Daftarkan OJT ke Toko" -- admin pilih toko + nama OJT, sistem
    // buatkan link khusus 1 OJT itu; begitu selesai dikerjakan skornya otomatis nempel ke
    // toko yang didaftarkan (muncul di menu "Progres OJT" pada akun toko tsb).
    function PsikotesScoresView({ test, stores, onBack }) {
      const [attempts, setAttempts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [links, setLinks] = useState([]);
      const [linksLoading, setLinksLoading] = useState(true);
      const [showRegister, setShowRegister] = useState(false);
      const [regStoreId, setRegStoreId] = useState('');
      const [regOjtName, setRegOjtName] = useState('');
      const [registering, setRegistering] = useState(false);
      const [copiedLinkId, setCopiedLinkId] = useState(null);
      const [regError, setRegError] = useState(''); // BUGFIX: lihat catatan di handleRegister
      const [answerDetailId, setAnswerDetailId] = useState(null); // id attempt yang kunci jawabannya sedang dibuka (admin)
      const [answerDetail, setAnswerDetail] = useState(null);
      const [answerDetailLoading, setAnswerDetailLoading] = useState(false);

      // BARU: helper copy-to-clipboard yang aman. navigator.clipboard butuh "secure context"
      // (https/localhost) DAN kadang tidak tersedia sama sekali di WebView APK lama -- kalau
      // dipanggil langsung tanpa jaga-jaga, errornya tidak tertangkap dan admin tidak dapat
      // link-nya sama sekali. Sekarang selalu ada fallback: tampilkan link via prompt supaya
      // tetap bisa disalin manual.
      const copyToClipboardSafe = async (text) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) { /* lanjut ke fallback di bawah */ }
        window.prompt('Salin link ini secara manual:', text);
        return false;
      };

      // BARU: admin lihat kunci jawaban + jawaban OJT (fitur ini sebelumnya HANYA ada di
      // sisi Toko -- di sisi Admin belum ada sama sekali, sehingga admin tidak punya cara
      // membuka kunci jawaban dari tab ini).
      const openAnswerDetail = async (attemptId) => {
        if (!attemptId) return;
        if (answerDetailId === attemptId) { setAnswerDetailId(null); setAnswerDetail(null); return; }
        setAnswerDetailId(attemptId);
        setAnswerDetail(null);
        setAnswerDetailLoading(true);
        try {
          const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/attempts/${attemptId}/answers`, { headers: __authHeaders() });
          const data = await res.json().catch(() => ({}));
          setAnswerDetail(res.ok ? (data.answers || []) : []);
        } catch (e) {
          setAnswerDetail([]);
        } finally { setAnswerDetailLoading(false); }
      };

      const load = async () => {
        setLoading(true);
        const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}/attempts`, { headers: __authHeaders() });
        const data = await res.json();
        if (res.ok) setAttempts(data.attempts);
        setLoading(false);
      };
      const loadLinks = async () => {
        setLinksLoading(true);
        try {
          const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}/ojt-links`, { headers: __authHeaders() });
          const data = await res.json();
          if (res.ok) setLinks(data.links);
        } finally { setLinksLoading(false); }
      };
      useEffect(() => { load(); loadLinks(); }, [test.id]);

      const handleUnblock = async (attemptId) => {
        await __apiFetch(`${WORKER_BASE}/api/psikotes/attempts/${attemptId}/unblock`, { method: 'POST', headers: __authHeaders() });
        load();
      };

      const handleDeleteAttempt = async (a) => {
        if (!window.confirm(`Hapus hasil psikotes milik "${a.ojt_name || a.penempatan}"? Data jawaban ikut terhapus dan tidak bisa dikembalikan.`)) return;
        await __apiFetch(`${WORKER_BASE}/api/psikotes/attempts/${a.id}`, { method: 'DELETE', headers: __authHeaders() });
        load(); loadLinks();
      };

      const handleRegister = async () => {
        if (!regStoreId || !regOjtName.trim()) return;
        setRegistering(true);
        setRegError('');
        try {
          const res = await __apiFetch(`${WORKER_BASE}/api/psikotes/tests/${test.id}/ojt-links`, {
            method: 'POST', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
            body: JSON.stringify({ storeId: regStoreId, ojtName: regOjtName.trim() }),
          });
          const data = await res.json();
          if (res.ok) {
            setRegOjtName(''); setRegStoreId(''); setShowRegister(false);
            await loadLinks();
            // Langsung salin link barunya ke clipboard supaya admin tinggal paste ke WA/dsb.
            const link = `${PUBLIC_APP_BASE}/psikotes.html?ojt=${data.linkToken}`;
            copyToClipboardSafe(link).then(() => {
              setCopiedLinkId(data.id);
              setTimeout(() => setCopiedLinkId(null), 3000);
            });
          } else {
            // BUGFIX: sebelumnya kalau gagal (mis. toko tidak valid), tidak ada pesan apa pun
            // ke admin -- form cuma diam, kelihatan seperti "tidak bisa disimpan" padahal
            // sebenarnya server menolak dengan alasan tertentu. Sekarang alasannya ditampilkan.
            setRegError(data.error || `Gagal membuat link OJT (status ${res.status}).`);
          }
        } catch (e) {
          setRegError('Gagal terhubung ke server. Periksa koneksi internet lalu coba lagi.');
        } finally { setRegistering(false); }
      };

      const copyLinkFor = async (link) => {
        let url = `${PUBLIC_APP_BASE}/psikotes.html?ojt=${link.link_token}`;
        try {
          // Coba ambil short link yang sudah ada
          const slRes = await __apiFetch(`${WORKER_BASE}/api/psikotes/short-links?token=${link.link_token}`, { headers: __authHeaders() });
          const slData = await slRes.json().catch(() => ({}));
          if (slRes.ok && slData.links && slData.links.length > 0) {
            url = `${PUBLIC_APP_BASE}/s/${slData.links[0].slug}`;
          } else {
            // Buat short link baru
            const mkRes = await __apiFetch(`${WORKER_BASE}/api/psikotes/short-links`, {
              method: 'POST', headers: { 'Content-Type': 'application/json', ...__authHeaders() },
              body: JSON.stringify({ target_url: url }),
            });
            const mkData = await mkRes.json().catch(() => ({}));
            if (mkRes.ok && mkData.slug) url = `${PUBLIC_APP_BASE}/s/${mkData.slug}`;
          }
        } catch (e) { /* fallback ke URL panjang */ }
        copyToClipboardSafe(url).then(() => {
          setCopiedLinkId(link.id);
          setTimeout(() => setCopiedLinkId(null), 2000);
        });
      };

      const handleDeleteLink = async (link) => {
        if (!window.confirm(`Hapus link OJT "${link.ojt_name}" (${link.store_name})? Link ini belum dipakai.`)) return;
        await __apiFetch(`${WORKER_BASE}/api/psikotes/ojt-links/${link.id}`, { method: 'DELETE', headers: __authHeaders() });
        loadLinks();
      };

      const statusBadge = (status) => {
        if (status === 'blocked') return <span className="text-[10px] bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded-md">Diblokir</span>;
        if (status === 'completed') return <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-1 rounded-md">Selesai</span>;
        return <span className="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-1 rounded-md">Mengerjakan</span>;
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="flex items-center gap-2">
            <button onClick={onBack} className="p-2 rounded-lg hover:bg-slate-100"><i data-lucide="arrow-left" className="w-4 h-4"></i></button>
            <h2 className="font-bold text-slate-700 text-base">Hasil — {test.title}</h2>
          </div>

          {/* ===== Daftarkan OJT ke Toko ===== */}
          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-slate-700 text-sm">OJT Terdaftar (per Toko)</h3>
              <button onClick={() => setShowRegister(v => !v)} className="flex items-center gap-1.5 bg-indigo-700 hover:bg-indigo-800 text-white text-xs font-bold px-3 py-2 rounded-xl">
                <i data-lucide="user-plus" className="w-3.5 h-3.5"></i> Daftarkan OJT
              </button>
            </div>
            <p className="text-xs text-slate-500">Pilih toko tempat OJT dilatih + nama OJT, lalu bagikan link yang dihasilkan. Skor psikotesnya otomatis muncul di akun toko yang dipilih.</p>

            {showRegister && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
                <div>
                  <label className="text-xs font-semibold text-slate-600">Toko Penempatan OJT</label>
                  <select value={regStoreId} onChange={e => setRegStoreId(e.target.value)} className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-white">
                    <option value="">Pilih toko...</option>
                    {(stores || []).map(s => <option key={s.id} value={s.id}>{s.name || s.id}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Nama OJT</label>
                  <input value={regOjtName} onChange={e => setRegOjtName(e.target.value)} placeholder="Nama lengkap OJT" className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" />
                </div>
                {regError && <p className="text-xs text-rose-600 font-semibold">{regError}</p>}
                <div className="flex gap-2">
                  <button onClick={() => setShowRegister(false)} className="flex-1 border border-slate-200 text-slate-600 text-sm font-semibold py-2 rounded-xl">Batal</button>
                  <button onClick={handleRegister} disabled={registering || !regStoreId || !regOjtName.trim()} className="flex-1 bg-indigo-700 hover:bg-indigo-800 disabled:opacity-50 text-white text-sm font-bold py-2 rounded-xl">{registering ? 'Membuat...' : 'Buat Link'}</button>
                </div>
              </div>
            )}

            {linksLoading ? (
              <div className="text-center text-slate-400 text-sm py-4"><i data-lucide="loader" className="w-5 h-5 animate-spin mx-auto"></i></div>
            ) : links.length === 0 ? (
              <div className="bg-white rounded-2xl border border-dashed border-slate-200 p-6 text-center text-slate-400 text-xs">Belum ada OJT yang didaftarkan ke toko untuk paket ini.</div>
            ) : (
              <div className="space-y-2">
                {links.map(l => (
                  <div key={l.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-4 flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <p className="font-semibold text-slate-800 text-sm truncate">{l.ojt_name}</p>
                        <p className="text-xs text-slate-500 truncate">{l.store_name}</p>
                        {l.auto_score !== null && l.auto_score !== undefined && <p className="text-xs text-purple-700 font-bold mt-0.5">Skor: {l.auto_score}</p>}
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        {l.status === 'unused' ? (
                          <>
                            <span className="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-1 rounded-md">Belum Dibuka</span>
                            <button onClick={() => copyLinkFor(l)} className="text-[11px] font-bold bg-slate-100 text-slate-700 px-2.5 py-1.5 rounded-lg">{copiedLinkId === l.id ? 'Tersalin!' : 'Salin Link'}</button>
                            <button onClick={() => handleDeleteLink(l)} className="text-slate-400 hover:text-rose-600 p-1.5"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                          </>
                        ) : statusBadge(l.attempt_status)}
                        {l.attempt_status === 'blocked' && (
                          <button onClick={() => handleUnblock(l.attempt_id)} className="text-[11px] font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg">Buka Blokir</button>
                        )}
                        {l.attempt_id && (l.attempt_status === 'completed' || l.attempt_status === 'blocked') && (
                          <button onClick={() => openAnswerDetail(l.attempt_id)} className="text-[11px] font-bold bg-purple-100 text-purple-800 px-2.5 py-1.5 rounded-lg">{answerDetailId === l.attempt_id ? 'Tutup' : 'Kunci Jawaban'}</button>
                        )}
                      </div>
                    </div>
                    {answerDetailId === l.attempt_id && (
                      <AnswerKeyPanel loading={answerDetailLoading} answers={answerDetail} />
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* ===== Semua hasil (termasuk yang isi nama/penempatan sendiri lewat link umum) ===== */}
          <div className="space-y-3">
            <h3 className="font-bold text-slate-700 text-sm">Semua Hasil</h3>
            {loading ? (
              <div className="text-center text-slate-400 text-sm py-8"><i data-lucide="loader" className="w-6 h-6 animate-spin mx-auto"></i></div>
            ) : attempts.length === 0 ? (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-10 text-center text-slate-500 text-sm">Belum ada OJT yang mengerjakan psikotes ini.</div>
            ) : (
              <div className="space-y-2">
                {attempts.map(a => (
                  <div key={a.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-4 flex items-center justify-between gap-3">
                      <div>
                        <p className="font-semibold text-slate-800 text-sm">{a.ojt_name}</p>
                        <p className="text-xs text-slate-500">{a.penempatan}</p>
                        {a.auto_score !== null && a.auto_score !== undefined && <p className="text-xs text-purple-700 font-bold mt-0.5">Skor: {a.auto_score}</p>}
                      </div>
                      <div className="flex items-center gap-2">
                        {statusBadge(a.status)}
                        {a.status === 'blocked' && (
                          <button onClick={() => handleUnblock(a.id)} className="text-[11px] font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded-lg">Buka Blokir</button>
                        )}
                        {(a.status === 'completed' || a.status === 'blocked') && (
                          <button onClick={() => openAnswerDetail(a.id)} className="text-[11px] font-bold bg-purple-100 text-purple-800 px-2.5 py-1.5 rounded-lg">{answerDetailId === a.id ? 'Tutup' : 'Kunci Jawaban'}</button>
                        )}
                        <button onClick={() => handleDeleteAttempt(a)} className="text-[11px] font-bold bg-rose-50 text-rose-600 hover:bg-rose-100 px-2.5 py-1.5 rounded-lg" title="Hapus hasil ini"><i data-lucide="trash-2" className="w-3 h-3 inline-block"></i></button>
                      </div>
                    </div>
                    {answerDetailId === a.id && (
                      <AnswerKeyPanel loading={answerDetailLoading} answers={answerDetail} />
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // BARU: panel "Kunci Jawaban" -- dipakai admin di PsikotesScoresView untuk melihat setiap
    // jawaban OJT dibandingkan kunci jawabannya (pilihan ganda) atau isi jawaban esai apa
    // adanya. Sebelumnya fitur pembanding ini HANYA ada di sisi Toko (StorePsikotesTab).
    function AnswerKeyPanel({ loading, answers }) {
      if (loading) {
        return <div className="border-t border-slate-100 p-4 text-center text-slate-400 text-xs"><i data-lucide="loader" className="w-4 h-4 animate-spin mx-auto"></i></div>;
      }
      if (!answers || answers.length === 0) {
        return <div className="border-t border-slate-100 p-4 text-center text-slate-400 text-xs">Belum ada jawaban tersimpan.</div>;
      }
      return (
        <div className="border-t border-slate-100 p-4 bg-slate-50 space-y-3">
          {answers.map((ans, i) => (
            <div key={ans.question_id} className="bg-white rounded-xl border border-slate-200 p-3 space-y-1.5">
              <p className="text-xs font-semibold text-slate-700">{i + 1}. {ans.question_text}</p>
              {ans.question_type === 'pilihan_ganda' ? (
                <div className="space-y-1">
                  {ans.options.map((opt, oi) => {
                    const isChosen = String(ans.answer_text) === String(oi);
                    const isCorrectOpt = ans.correct_index === oi;
                    return (
                      <div key={oi} className={`text-[11px] px-2 py-1 rounded-lg ${isChosen && isCorrectOpt ? 'bg-emerald-50 text-emerald-700 font-semibold' : isChosen ? 'bg-rose-50 text-rose-700 font-semibold' : isCorrectOpt ? 'text-emerald-600' : 'text-slate-500'}`}>
                        {opt} {isChosen && '• dipilih'} {isCorrectOpt && '• kunci jawaban'}
                      </div>
                    );
                  })}
                </div>
              ) : (
                <p className="text-[11px] text-slate-600 whitespace-pre-wrap bg-slate-50 rounded-lg p-2">{ans.answer_text || <span className="text-slate-400">Tidak dijawab</span>}</p>
              )}
            </div>
          ))}
        </div>
      );
    }

    function LoginScreen({ onLoggedIn }) {
      const [mode, setMode] = useState('store'); // 'store' | 'admin'
      const [adminExists, setAdminExists] = useState(null); // null = belum dicek
      const [storeDirectory, setStoreDirectory] = useState([]);
      const [dirLoading, setDirLoading] = useState(true);
      const [dirError, setDirError] = useState(false);
      const [dirErrorDetail, setDirErrorDetail] = useState('');
      const [dirFromCache, setDirFromCache] = useState(false);
      // BARU: penanda "sedang menyegarkan data terbaru di belakang layar" — dipakai saat
      // daftar toko dari cache SUDAH ditampilkan instan, tapi fetch ke server masih berjalan
      // diam-diam untuk memastikan datanya paling baru. Beda dengan dirFromCache (yang
      // menampilkan banner peringatan) — ini sepenuhnya senyap, tidak memblokir apa pun.
      const [dirBackgroundSync, setDirBackgroundSync] = useState(false);
      const [adminCheckError, setAdminCheckError] = useState(false);
      const [reloadTick, setReloadTick] = useState(0);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      // Form state
      const [storeId, setStoreId] = useState('');
      const [token, setToken] = useState('');
      // Kombobox "Pilih Toko" bisa dicari & discroll (bukan <select> polos lagi) supaya
      // tidak langsung memuat/menampilkan SEMUA pilihan toko sekaligus memenuhi layar
      // saat daftar toko banyak — daftar dibatasi tinggi (scroll) + ada input pencarian.
      const [storeDropdownOpen, setStoreDropdownOpen] = useState(false);
      const [storeSearchQuery, setStoreSearchQuery] = useState('');
      const storeDropdownRef = React.useRef(null);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminPassword2, setAdminPassword2] = useState('');

      useEffect(() => {
        scheduleLucideIcons();
      });

      // Tutup dropdown "Pilih Toko" saat klik di luar area kombobox.
      useEffect(() => {
        const handleOutsideClick = (e) => {
          if (storeDropdownRef.current && !storeDropdownRef.current.contains(e.target)) {
            setStoreDropdownOpen(false);
          }
        };
        document.addEventListener('mousedown', handleOutsideClick);
        return () => document.removeEventListener('mousedown', handleOutsideClick);
      }, []);

      const filteredStoreDirectory = storeDirectory.filter(s =>
        !storeSearchQuery.trim() || s.name.toLowerCase().includes(storeSearchQuery.trim().toLowerCase())
      );
      const selectedStoreName = (storeDirectory.find(s => s.id === storeId) || {}).name || '';

      // Ambil status admin & daftar toko. Diberi timeout + AUTO-RETRY (dengan jeda makin lama) +
      // tombol "Muat Ulang" manual, supaya kalau koneksi Firebase lambat/putus-nyambung (jaringan
      // seluler lemah, baru pindah WiFi/data, dsb), aplikasi mencoba lagi sendiri beberapa kali dulu
      // sebelum benar-benar menampilkan pesan error ke pengguna (ini penyebab utama keluhan
      // "pilih toko tidak muncul" / "gagal memuat data dari server" saat koneksi kurang stabil).
      //
      // PERBAIKAN (stale-while-revalidate): sebelumnya halaman SELALU menunggu penuh sampai
      // fetch ke server selesai sebelum menampilkan apa pun ("Memuat daftar toko..." blocking),
      // padahal HP ini mungkin sudah punya daftar toko tersimpan dari login sebelumnya
      // (tarobun_dir_cache). Sekarang: kalau ada cache, TAMPILKAN DULU SECARA INSTAN (0 network,
      // dropdown langsung bisa dipakai) sambil diam-diam menyegarkan data terbaru di belakang
      // layar — baru DIGANTI otomatis begitu data terbaru datang. Kalau tidak ada cache sama
      // sekali (login pertama kali di HP ini), baru tampil "Memuat daftar toko..." seperti biasa.
      useEffect(() => {
        let cancelled = false;
        let attempt = 0;
        const MAX_ATTEMPTS = 3;

        let hasCache = false;
        try {
          const cached = JSON.parse(localStorage.getItem('tarobun_dir_cache') || 'null');
          if (cached && cached.length > 0) {
            hasCache = true;
            setStoreDirectory(cached);
            setDirLoading(false);       // sudah ada data untuk dipakai, tidak perlu blocking
            setDirBackgroundSync(true); // tandai sedang disegarkan diam-diam
          }
        } catch (e) {}

        setDirLoading(hasCache ? false : true);
        setDirError(false);
        setDirFromCache(false);
        setAdminCheckError(false);

        const tryLoad = () => {
          attempt += 1;
          // Pakai Cloudflare Worker (HTTPS biasa) bukan Firebase WebSocket supaya
          // tidak kena blokir jaringan seluler yang sering memblokir koneksi WebSocket.
          __apiFetch(`${WORKER_BASE}/api/rtdb?path=storeDirectory`)
            .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
            .then(data => {
              if (cancelled) return;
              const raw = data.value || {};
              const list = Object.keys(raw).map(id => ({ id, name: raw[id] })).sort((a, b) => a.name.localeCompare(b.name));
              setStoreDirectory(list);
              setDirLoading(false);
              setDirError(false);
              setDirFromCache(false);
              setDirBackgroundSync(false);
              try { localStorage.setItem('tarobun_dir_cache', JSON.stringify(list)); } catch (e) {}
            })
            .catch((err) => {
              if (cancelled) return;
              setDirErrorDetail(String(err && err.message ? err.message : err));
              if (attempt < MAX_ATTEMPTS) {
                setTimeout(tryLoad, 1000 * attempt);
              } else {
                setDirBackgroundSync(false);
                useDirCacheFallback();
              }
            });
        };

        // Kalau semua percobaan koneksi ke database gagal (jaringan benar-benar bermasalah),
        // jangan langsung "buntu" — pakai daftar toko terakhir yang berhasil dimuat & tersimpan
        // di HP ini (localStorage), supaya toko/admin tetap bisa mencoba login sambil menunggu
        // koneksi pulih. Tombol "Muat Ulang" tetap tersedia untuk coba ambil data terbaru lagi.
        const useDirCacheFallback = () => {
          setDirLoading(false);
          try {
            const cached = JSON.parse(localStorage.getItem('tarobun_dir_cache') || 'null');
            if (cached && cached.length > 0) {
              setStoreDirectory(cached);
              setDirFromCache(true);
              setDirError(false);
              return;
            }
          } catch (e) {}
          setDirError(true);
        };

        const tryAdminCheck = (n) => {
          __apiFetch(`${WORKER_BASE}/api/admin-exists`)
            .then(res => { if (!res.ok) throw new Error('admin-exists gagal'); return res.json(); })
            .then(data => {
              if (cancelled) return;
              const exists = data.exists === true;
              setAdminExists(exists);
              try { localStorage.setItem('tarobun_admin_exists_cache', JSON.stringify(exists)); } catch (e) {}
            })
            .catch(() => {
              if (cancelled) return;
              if (n < MAX_ATTEMPTS) {
                setTimeout(() => tryAdminCheck(n + 1), 1000 * n);
              } else {
                try {
                  const cached = JSON.parse(localStorage.getItem('tarobun_admin_exists_cache') || 'null');
                  if (cached !== null) { setAdminExists(cached); return; }
                } catch (e) {}
                setAdminExists(null);
                setAdminCheckError(true);
              }
            });
        };

        tryLoad();
        tryAdminCheck(1);

        return () => {
          cancelled = true;
        };
      }, [reloadTick]);

      // Deteksi koneksi nyata: kalau HP sempat kehilangan sinyal/WiFi lalu nyambung lagi, browser
      // akan memicu event 'online'. Sebelumnya, kalau error sudah terlanjur muncul, pengguna HARUS
      // pencet "Muat Ulang" manual walau internetnya sudah pulih. Sekarang begitu koneksi pulih,
      // otomatis dicoba ulang sendiri tanpa perlu disentuh.
      useEffect(() => {
        const handleOnline = () => {
          if (dirError || adminCheckError) setReloadTick(t => t + 1);
        };
        window.addEventListener('online', handleOnline);
        return () => window.removeEventListener('online', handleOnline);
      }, [dirError, adminCheckError]);

      // Auto-refresh daftar toko & status admin setiap kali halaman login ini dibuka/dilihat lagi
      // (misal: admin baru saja membuat cabang baru di tab lain, lalu pindah balik ke tab Login Toko).
      // Sebelumnya data cuma diambil SEKALI saat halaman pertama dibuka, jadi cabang baru tidak
      // muncul sampai di-refresh manual. Sekarang otomatis ambil data terbaru tiap tab ini aktif lagi.
      useEffect(() => {
        const handleVisible = () => {
          if (document.visibilityState === 'visible') setReloadTick(t => t + 1);
        };
        document.addEventListener('visibilitychange', handleVisible);
        window.addEventListener('focus', handleVisible);
        return () => {
          document.removeEventListener('visibilitychange', handleVisible);
          window.removeEventListener('focus', handleVisible);
        };
      }, []);

      // BUGFIX (2026-08): polling /api/data-version untuk key 'storeDirectory' supaya
      // halaman login OTOMATIS mendeteksi toko baru yang dibuat admin (dari HP/tab lain)
      // dan langsung refetch tanpa perlu user melakukan apa-apa (refresh manual / pindah tab).
      // Sebelumnya LoginScreen tidak punya mekanisme ini — hanya mengandalkan visibilitychange
      // (pindah tab) atau focus — sehingga kalau admin dan toko memakai HP masing-masing,
      // toko baru tidak pernah muncul di dropdown login sampai toko me-refresh halaman.
      useEffect(() => {
        let stopped = false;
        let lastKnownVersion = -1;
        const poll = async () => {
          if (stopped) return;
          try {
            const res = await fetch(`${WORKER_BASE}/api/data-version?keys=storeDirectory`);
            if (res.ok) {
              const data = await res.json();
              const v = (data && data.versions && data.versions['storeDirectory']) || 0;
              if (lastKnownVersion === -1) {
                // Inisialisasi: simpan versi saat ini tanpa trigger reload
                lastKnownVersion = v;
              } else if (v !== lastKnownVersion) {
                // Versi berubah: ada toko baru atau toko dihapus -> refetch daftar toko
                lastKnownVersion = v;
                setReloadTick(t => t + 1);
              }
            }
          } catch (e) { /* gagal 1 siklus tidak fatal */ }
          if (!stopped) setTimeout(poll, 15000); // cek setiap 15 detik
        };
        poll();
        return () => { stopped = true; };
      }, []);

      const handleStoreLogin = async (e) => {
        e.preventDefault();
        setError('');
        if (!storeId || !token) { setError('Pilih toko & isi token.'); return; }
        setLoading(true);
        try {
          const email = storeIdToEmail(storeId);
          const cred = await auth.signInWithEmailAndPassword(email, token);
          const info = cred.storeInfo;
          if (!info || info.active === false) {
            await auth.signOut();
            setError('Akun toko ini sudah tidak aktif. Hubungi admin.');
            setLoading(false);
            return;
          }
          saveSession('store', { storeId, storeName: info.name });
          onLoggedIn({ role: 'store', storeId, storeName: info.name });
        } catch (err) {
          // Anti brute-force sepenuhnya ditangani server (lihat catatan KEAMANAN di atas):
          // kalau terlalu banyak percobaan gagal, server membalas status 429 dengan pesan
          // sisa waktu kunci -- tampilkan APA ADANYA, jangan diseragamkan.
          if (err && err.status === 429) {
            setError(err.message || 'Terlalu banyak percobaan login gagal. Coba lagi beberapa saat lagi.');
          } else if (err && err.status === 409) {
            setError(err.message || 'Sudah ada perangkat lain yang sedang aktif memakai akun toko ini.');
          } else {
            setError('Nama toko atau token salah.');
          }
        } finally {
          setLoading(false);
        }
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          if (adminExists === false) {
            // Setup admin pertama kali
            if (adminPassword.length < 8) { setError('Password minimal 8 karakter.'); setLoading(false); return; }
            if (adminPassword !== adminPassword2) { setError('Konfirmasi password tidak cocok.'); setLoading(false); return; }
            const cred = await auth.createUserWithEmailAndPassword(ADMIN_EMAIL, adminPassword);
            await restSet(db.ref(`admins/${cred.user.uid}`), true);
            await restSet(db.ref('meta/adminAccountExists'), true);
            saveSession('admin', {});
            onLoggedIn({ role: 'admin' });
            return;
          }
          await auth.signInWithEmailAndPassword(ADMIN_EMAIL, adminPassword);
          saveSession('admin', {});
          onLoggedIn({ role: 'admin' });
        } catch (err) {
          // Anti brute-force sepenuhnya ditangani server -- lihat catatan KEAMANAN di atas.
          if (err && err.status === 429) {
            setError(err.message || 'Terlalu banyak percobaan login gagal. Coba lagi beberapa saat lagi.');
          } else if (adminExists === false && /sudah/i.test(err.message || '')) {
            // Server bilang admin sebenarnya sudah ada (flag di sisi ini sempat tidak sinkron,
            // dan sudah otomatis dibetulkan oleh server barusan) — langsung alihkan ke form Login
            // supaya pengguna tidak bingung dan tidak coba "buat akun" berulang-ulang.
            setAdminExists(true);
            setAdminPassword('');
            setAdminPassword2('');
            setError('Akun admin sudah pernah dibuat sebelumnya. Silakan masukkan password admin untuk login.');
          } else {
            setError(adminExists === false ? 'Gagal membuat akun admin.' : 'Password admin salah.');
          }
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-900 via-indigo-900 to-slate-900 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 sm:p-8">
            <div className="flex flex-col items-center mb-6">
              <img
                src="icon-512.png"
                alt="Logo Tarobun"
                className="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-contain shadow-md mb-3"
              />
              <h1 className="font-display font-extrabold text-slate-800 text-lg">TAROBUN SO Mandiri Hub</h1>
              <p className="text-xs text-slate-600 text-center mt-1">Masuk sebagai toko atau admin pusat</p>
            </div>

            <div className="grid grid-cols-2 gap-2 bg-slate-100 rounded-xl p-1 mb-6">
              <button onClick={() => { setMode('store'); setError(''); }} className={`py-2 rounded-lg text-sm font-bold transition-all ${mode === 'store' ? 'bg-white shadow text-purple-800' : 'text-slate-500'}`}>Login Toko</button>
              <button onClick={() => { setMode('admin'); setError(''); }} className={`py-2 rounded-lg text-sm font-bold transition-all ${mode === 'admin' ? 'bg-white shadow text-purple-800' : 'text-slate-500'}`}>Login Admin</button>
            </div>

            {error && (
              <div className="bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold rounded-lg px-3 py-2 mb-4">{error}</div>
            )}

            {dirError && (
              <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold rounded-lg px-3 py-2 mb-4 flex items-center justify-between gap-2">
                <span>Gagal memuat data dari server. Cek koneksi internet Anda.{dirErrorDetail ? ` (Detail: ${dirErrorDetail})` : ''}</span>
                <button type="button" onClick={() => setReloadTick(t => t + 1)} className="shrink-0 bg-amber-600 text-white text-[10px] font-bold px-2 py-1 rounded-lg">Muat Ulang</button>
              </div>
            )}

            {dirFromCache && !dirError && (
              <div className="bg-sky-50 border border-sky-200 text-sky-700 text-xs font-semibold rounded-lg px-3 py-2 mb-4 flex items-center justify-between gap-2">
                <span>Koneksi lambat — menampilkan data toko tersimpan (mungkin tidak terbaru).</span>
                <button type="button" onClick={() => setReloadTick(t => t + 1)} className="shrink-0 bg-sky-600 text-white text-[10px] font-bold px-2 py-1 rounded-lg">Sinkron Ulang</button>
              </div>
            )}

            {mode === 'store' ? (
              <form onSubmit={handleStoreLogin} className="space-y-4">
                <div ref={storeDropdownRef} className="relative">
                  <label htmlFor="storeId" className="block text-xs font-semibold text-slate-600 mb-1 flex items-center gap-1.5">
                    <span>Nama Toko</span>
                    {dirBackgroundSync && (
                      <span className="inline-flex items-center gap-1 text-[10px] font-normal text-slate-400">
                        <i data-lucide="loader-2" className="w-3 h-3 animate-spin"></i>
                        Menyegarkan...
                      </span>
                    )}
                  </label>
                  {/* Kombobox kustom (bukan <select> polos): daftar toko dibatasi tinggi & bisa
                      discroll, plus ada kolom pencarian, supaya saat toko banyak tidak langsung
                      memenuhi layar dan lebih mudah ditemukan. Input tersembunyi 'storeId' tetap
                      dipertahankan untuk validasi form (required) & submit. */}
                  <input type="hidden" id="storeId" value={storeId} />
                  <button
                    type="button"
                    disabled={dirLoading}
                    onClick={() => setStoreDropdownOpen(o => !o)}
                    className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm bg-white flex items-center justify-between gap-2 disabled:opacity-60 text-left"
                  >
                    <span className={`truncate ${selectedStoreName ? 'text-slate-800' : 'text-slate-400'}`}>
                      {dirLoading ? 'Memuat daftar toko...' : (selectedStoreName || (storeDirectory.length === 0 ? 'Tidak ada toko terdaftar' : '-- Pilih Toko --'))}
                    </span>
                    <i data-lucide="chevron-down" className={`w-4 h-4 text-slate-400 shrink-0 transition-transform ${storeDropdownOpen ? 'rotate-180' : ''}`}></i>
                  </button>

                  {storeDropdownOpen && !dirLoading && (
                    <div className="absolute z-30 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg animate-fadeIn overflow-hidden">
                      {storeDirectory.length > 4 && (
                        <div className="p-2 border-b border-slate-100">
                          <div className="relative">
                            <i data-lucide="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                            <input
                              type="text"
                              autoFocus
                              value={storeSearchQuery}
                              onChange={(e) => setStoreSearchQuery(e.target.value)}
                              placeholder="Cari nama toko..."
                              className="w-full pl-8 pr-2.5 py-1.5 border border-slate-300 rounded-lg text-xs"
                            />
                          </div>
                        </div>
                      )}
                      {/* Dibatasi tinggi supaya HANYA ~4 toko yang terlihat sekaligus (tidak lagi
                          memenuhi/menutupi layar saat daftar toko banyak) -- sisanya wajib discroll
                          atau dicari lewat kotak pencarian di atas. */}
                      <ul className="max-h-[168px] overflow-y-auto py-1 overscroll-contain">
                        {filteredStoreDirectory.length === 0 && (
                          <li className="px-3 py-2.5 text-xs text-slate-400 text-center">
                            {storeDirectory.length === 0 ? 'Tidak ada toko terdaftar' : `Tidak ada toko yang cocok dengan "${storeSearchQuery}".`}
                          </li>
                        )}
                        {filteredStoreDirectory.map(s => (
                          <li key={s.id}>
                            <button
                              type="button"
                              onClick={() => { setStoreId(s.id); setStoreDropdownOpen(false); setStoreSearchQuery(''); }}
                              className={`w-full text-left px-3 py-2 text-sm truncate ${storeId === s.id ? 'bg-purple-50 text-purple-800 font-semibold' : 'text-slate-700 hover:bg-slate-50'}`}
                            >
                              {s.name}
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
                <div>
                  <label htmlFor="token" className="block text-xs font-semibold text-slate-600 mb-1">Token Toko</label>
                  <input id="token" type="password" value={token} onChange={(e) => setToken(e.target.value)} placeholder="Masukkan token dari admin" className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" required autoComplete="current-password" />
                </div>
                <button type="submit" disabled={loading} className="w-full bg-purple-800 hover:bg-purple-900 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm">
                  {loading ? 'Memproses...' : 'Masuk sebagai Toko'}
                </button>
              </form>
            ) : (
              <form onSubmit={handleAdminLogin} className="space-y-4">
                {adminExists === false && (
                  <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold rounded-lg px-3 py-2">
                    Belum ada akun admin. Buat password admin pertama kali di bawah ini.
                  </div>
                )}
                {adminCheckError && adminExists === null && (
                  <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold rounded-lg px-3 py-2">
                    Gagal memeriksa status akun admin, tapi Anda tetap bisa mencoba masuk di bawah ini.
                  </div>
                )}
                <div>
                  <label htmlFor="adminPassword" className="block text-xs font-semibold text-slate-600 mb-1">Password Admin</label>
                  <input id="adminPassword" type="password" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" required autoComplete={adminExists === false ? 'new-password' : 'current-password'} minLength={adminExists === false ? 8 : undefined} />
                </div>
                {adminExists === false && (
                  <div>
                    <label htmlFor="adminPassword2" className="block text-xs font-semibold text-slate-600 mb-1">Konfirmasi Password</label>
                    <input id="adminPassword2" type="password" value={adminPassword2} onChange={(e) => setAdminPassword2(e.target.value)} className="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm" required minLength={8} />
                  </div>
                )}
                <button type="submit" disabled={loading} className="w-full bg-indigo-900 hover:bg-indigo-950 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm">
                  {loading ? 'Memproses...' : (adminExists === false ? 'Buat Akun Admin' : 'Masuk sebagai Admin')}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // PANEL ADMIN
    // ==========================================
    // Titik indikator status online toko — dipakai di berbagai tempat (kartu daftar toko, chat,
    // modal detail, monitor kehadiran). Kalau online: titik hijau solid + ripple "ping" melebar-
    // memudar lembut & perlahan di belakangnya. Kalau offline: titik abu-abu diam saja (animasi
    // untuk status mati justru membingungkan, jadi sengaja tidak dianimasikan).
    function PresenceDot({ isOnline, size = 'w-2.5 h-2.5' }) {
      return (
        <span className={`relative inline-flex ${size} shrink-0`}>
          {isOnline && (
            <span className={`presence-dot-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400`}></span>
          )}
          <span className={`relative inline-flex rounded-full ${size} ${isOnline ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>
        </span>
      );
    }

    // Blok skeleton shimmer generik — pengganti teks "Memuat..." polos. `className` menentukan
    // ukuran/bentuknya (mis. "h-4 w-24" utk baris teks, "h-20 w-20 rounded-full" utk avatar).
    function Skeleton({ className = '' }) {
      return <div className={`skeleton ${className}`}></div>;
    }

    // ==========================================
    // PEMILIH TOKO DENGAN PENCARIAN (2026-08-06)
    // ==========================================
    // Dipakai di semua tempat Admin memilih toko (Update Web, field tambahan Form Builder,
    // SOP per-toko, dst) — sebelumnya daftar toko ditampilkan PENUH tanpa batas tinggi/pencarian,
    // jadi merepotkan begitu jumlah toko sudah banyak. Sekarang: ada kotak cari (muncul otomatis
    // kalau toko lebih dari 5), dan daftarnya dibatasi tinggi + bisa discroll, tidak lagi
    // menampilkan semua sekaligus memenuhi layar.
    // mode "chips": tombol bulat kecil (dipakai Form Builder & SOP). mode "checkbox": daftar
    // dengan checkbox (dipakai Update Web).
    function StorePicker({ stores, selectedIds, onToggle, onSelectAll, allLabel = 'Semua Toko', mode = 'chips', activeColorClass = 'bg-purple-800 text-white border-purple-800', maxHeight = 'max-h-44' }) {
      const [query, setQuery] = useState('');
      const q = query.trim().toLowerCase();
      const filtered = q ? stores.filter(s => (s.name || '').toLowerCase().includes(q)) : stores;

      return (
        <div>

        // ditangani Durable Object (0 Rows D1), jadi aman di-poll lebih sering (8 detik)

        let stopped = false;

      const [, forcePresenceTick] = useState(0);
