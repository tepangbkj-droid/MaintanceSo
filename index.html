    // Komponen tombol "titik" indikator langkah pada TourGuide (dipakai di tooltip & modal info).
    function TourStepDots({ steps, idx }) {
      return (
        <div className="flex items-center justify-center gap-1.5 mb-4 flex-wrap">
          {steps.map((_, i) => (
            <span key={i} className={`h-1.5 rounded-full transition-all ${i === idx ? 'w-5 bg-purple-700' : 'w-1.5 bg-slate-200'}`}></span>
          ))}
        </div>
      );
    }

    // TourGuide: onboarding interaktif dengan spotlight highlight ke elemen menu ASLI di sidebar
    // (bukan cuma modal generik). Ringan: 1 kotak spotlight (trik box-shadow, murni CSS) + 1 kartu
    // tooltip yang posisinya dihitung ulang dari getBoundingClientRect() elemen target, tanpa
    // request API apa pun. Kalau step tidak punya target, tampil sebagai modal di tengah layar
    // (dipakai untuk step pembuka & step info yang tidak punya menu fisik).
    function TourGuide({ steps, onFinish, onOpenMenu }) {
      const [idx, setIdx] = useState(0);
      const [rect, setRect] = useState(null);
      const step = steps[idx];
      const isLast = idx === steps.length - 1;

      // Buka sidebar hamburger otomatis kalau ada step yang butuh menyorot menu di dalamnya,
      // supaya pengguna tidak perlu membuka menu manual saat tur berjalan.
      useEffect(() => {
        const needsMenu = steps.some(s => s.target);
        if (needsMenu && onOpenMenu) onOpenMenu(true);
        scheduleLucideIcons();
      }, []);

      useEffect(() => {
        scheduleLucideIcons();
        if (!step.target) { setRect(null); return; }
        let cancelled = false;
        const measure = () => {
          if (cancelled) return;
          const el = document.querySelector(step.target);
          if (el) {
            el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            const r = el.getBoundingClientRect();
            setRect({ top: r.top, left: r.left, width: r.width, height: r.height });
          } else {
            setRect(null);
          }
        };
        const t = setTimeout(measure, 320); // tunggu animasi buka sidebar (0.28s) selesai
        window.addEventListener('resize', measure);
        return () => { cancelled = true; clearTimeout(t); window.removeEventListener('resize', measure); };
      }, [idx]);

      const goNext = () => { if (isLast) onFinish(); else setIdx(idx + 1); };
      const skipAll = () => onFinish();

      // Modal biasa di tengah (tanpa target)
      if (!rect) {
        return (
          <div className="fixed inset-0 z-[102] bg-black/60 flex items-center justify-center p-4 animate-fadeIn">
            <div className="bg-white rounded-2xl animate-scaleIn max-w-sm w-full p-6 shadow-2xl">
              <div className="w-12 h-12 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center mb-4">
                <i data-lucide={step.icon} className="w-6 h-6"></i>
              </div>
              <h3 className="font-bold text-slate-800 text-base mb-1">{step.title}</h3>
              <p className="text-sm text-slate-500 mb-5">{step.desc}</p>
              <TourStepDots steps={steps} idx={idx} />
              <div className="flex items-center justify-between gap-2">
                <button onClick={skipAll} className="text-xs font-bold text-slate-500 hover:text-slate-700 px-2 py-2">
                  Lewati Semua
                </button>
                <button onClick={goNext} className="bg-purple-800 hover:bg-purple-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl">
                  {isLast ? 'Selesai' : 'Lanjut'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Mode spotlight: sorot elemen menu asli + kartu tooltip mengikuti posisinya
      const pad = 6;
      const boxTop = Math.max(rect.top - pad, 4);
      const boxLeft = Math.max(rect.left - pad, 4);
      const boxWidth = rect.width + pad * 2;
      const boxHeight = rect.height + pad * 2;

      const spaceBelow = window.innerHeight - (rect.top + rect.height);
      const placeBelow = spaceBelow > 200 || spaceBelow > rect.top;
      const cardTop = placeBelow
        ? Math.min(rect.top + rect.height + 14, window.innerHeight - 220)
        : Math.max(rect.top - 14, 12);
      const cardLeft = Math.min(Math.max(rect.left, 12), window.innerWidth - 296);

      return (
        <React.Fragment>
          {/* Penahan klik: mencegah pengguna tidak sengaja menutup sidebar/menekan menu lain saat tur aktif */}
          <div className="tour-click-shield" onClick={(e) => e.stopPropagation()}></div>
          <div
            className="tour-spotlight-box"
            style={{ top: boxTop, left: boxLeft, width: boxWidth, height: boxHeight }}
          ></div>
          <div
            className="tour-tooltip-card animate-scaleIn"
            style={{ top: cardTop, left: cardLeft, transform: placeBelow ? 'none' : 'translateY(-100%)' }}
          >
            <div className="bg-white rounded-2xl shadow-2xl p-4 border border-purple-100">
              <div className="flex items-center gap-2 mb-2">
                <div className="w-8 h-8 shrink-0 rounded-lg bg-purple-100 text-purple-700 flex items-center justify-center">
                  <i data-lucide={step.icon} className="w-4 h-4"></i>
                </div>
                <h3 className="font-bold text-slate-800 text-sm">{step.title}</h3>
              </div>
              <p className="text-xs text-slate-500 mb-3 leading-relaxed">{step.desc}</p>
              <TourStepDots steps={steps} idx={idx} />
              <div className="flex items-center justify-between gap-2">
                <button onClick={skipAll} className="text-[11px] font-bold text-slate-500 hover:text-slate-700 px-2 py-2">
                  Lewati Semua
                </button>
                <button onClick={goNext} className="bg-purple-800 hover:bg-purple-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl">
                  {isLast ? 'Selesai' : 'Lanjut'}
                </button>
              </div>
            </div>
          </div>
        </React.Fragment>
      );
    }

    // Pop-up peringatan WAJIB di akhir tur: berisi daftar pekerjaan yang tidak boleh dilupakan.
    // Sengaja tidak bisa ditutup lewat klik backdrop/tombol X — hanya lewat tombol konfirmasi,
    // dan tombol itu baru aktif setelah kotak centang "sudah membaca" dicentang.
    function MandatoryChecklistModal({ items, onAcknowledge }) {
      const [checked, setChecked] = useState(false);
      useEffect(() => { scheduleLucideIcons(); }, [checked]);
      return (
        <div className="fixed inset-0 z-[110] bg-black/75 flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white rounded-2xl animate-scaleIn max-w-sm w-full p-6 shadow-2xl border-t-4 border-rose-600">
            <div className="w-12 h-12 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center mb-4">
              <i data-lucide="alert-triangle" className="w-6 h-6"></i>
            </div>
            <h3 className="font-bold text-slate-800 text-base mb-1">Jangan Sampai Lupa! ⚠️</h3>
            <p className="text-xs text-slate-500 mb-4">Beberapa hal ini WAJIB dilakukan setiap hari — mohon dibaca sampai selesai:</p>
            <ul className="space-y-2 mb-5 max-h-60 overflow-y-auto pr-1">
              {items.map((item, i) => (
                <li key={i} className="flex items-start gap-2 text-xs text-slate-700 bg-rose-50 rounded-lg p-2.5">
                  <i data-lucide={item.icon} className="w-4 h-4 text-rose-600 shrink-0 mt-0.5"></i>
                  <span>{item.text}</span>
                </li>
              ))}
            </ul>
            <label className="flex items-start gap-2 mb-4 cursor-pointer select-none">
              <input
                type="checkbox"
                checked={checked}
                onChange={(e) => setChecked(e.target.checked)}
                className="mt-0.5 w-4 h-4 accent-rose-600 shrink-0"
              />
              <span className="text-xs text-slate-600 font-semibold">Saya sudah membaca & memahami semua poin di atas.</span>
            </label>
            <button
              disabled={!checked}
              onClick={onAcknowledge}
              className={`w-full text-xs font-bold px-4 py-3 rounded-xl transition-all ${checked ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}
            >
              Saya Mengerti, Lanjutkan
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // HALAMAN LOGIN (ADMIN & TOKO)
    // ==========================================
    // ==========================================
    // SPLASH SCREEN (animasi pembuka saat aplikasi pertama kali dibuka)
    // ==========================================
    // Ditampilkan sebentar (logo fade-in + scale-up) sebelum masuk ke halaman
    // Login/utama. onFinish dipanggil otomatis lewat animasi CSS "tarobun-splash"
    // (lihat <style> di <head>) setelah durasi tampil selesai.
    function SplashScreen({ onFinish }) {
      useEffect(() => {
        const timer = setTimeout(onFinish, 1800);
        return () => clearTimeout(timer);
      }, [onFinish]);

      return (
        <div
          className="tarobun-splash fixed inset-0 z-[999] flex flex-col items-center justify-center bg-gradient-to-br from-purple-900 via-indigo-900 to-slate-900"
          onAnimationEnd={(e) => { if (e.animationName === 'tarobunSplashOut') onFinish(); }}
        >
          <img
            src="icon-512.png"
            alt="Tarobun"
            className="tarobun-splash-logo w-28 h-28 sm:w-32 sm:h-32 rounded-3xl shadow-2xl object-contain bg-white/5"
          />
          <div className="tarobun-splash-text mt-5 text-center">
            <h1 className="text-white font-display font-extrabold text-lg tracking-wide">TAROBUN SO Mandiri Hub</h1>
            <p className="text-purple-200 text-xs mt-1">Memuat aplikasi...</p>
          </div>
        </div>
      );
    }

    // ==========================================
    // HALAMAN PUBLIK: Psikotes OJT (dibuka lewat link, TANPA login)
    // ==========================================
    // Alur: form Nama+Penempatan -> kerjakan soal satu-satu -> selesai.
    // Anti-keluar: kalau tab/app di-minimize atau pindah tab saat status 'taking',
    // langsung dilaporkan ke server (flag-leave) dan attempt ditandai 'blocked'.
    // JUJUR soal batasan: browser TIDAK memungkinkan web mencegah tab ditutup/di-refresh
    // sepenuhnya (itu kontrol milik user, bukan website) -- yang bisa dilakukan hanya
    // MENDETEKSI ketika itu terjadi lalu mengunci attempt-nya sampai admin buka blokir,
    // bukan benar-benar mencegah user pindah tab secara fisik.
    function PsikotesOjtPublicPage({ linkToken, assigned }) {
      // assigned=true -> link per-OJT yang didaftarkan admin (nama+toko sudah pasti, lewat
      // ?ojt=TOKEN). assigned=false -> link umum satu paket (alur lama, lewat ?psikotes=TOKEN),
      // OJT isi sendiri nama+penempatan.
      const storageKey = `tarobun_psikotes_attempt_${linkToken}`;
      const infoUrl = assigned ? `${WORKER_BASE}/api/psikotes/public/ojt/${linkToken}` : `${WORKER_BASE}/api/psikotes/public/${linkToken}`;
      const startUrl = assigned ? `${WORKER_BASE}/api/psikotes/public/ojt/${linkToken}/start` : `${WORKER_BASE}/api/psikotes/public/${linkToken}/start`;
      const [phase, setPhase] = useState('loading'); // loading | form | confirm | taking | blocked | done | error
      const [errorMsg, setErrorMsg] = useState('');
      const [test, setTest] = useState(null);
      const [name, setName] = useState('');
      const [penempatan, setPenempatan] = useState('');
      // BARU (2026-08): untuk link umum (?psikotes=TOKEN, termasuk yang di-share masal lewat
      // /s/<slug>), OJT sekarang WAJIB memilih toko dari daftar toko asli sistem (dropdown),
      // bukan ketik bebas -- supaya skornya PASTI nyambung ke akun toko yang benar, tidak
      // gagal cocok gara-gara typo/beda penulisan nama toko.
      const [storeOptions, setStoreOptions] = useState([]);
      const [storeOptionsError, setStoreOptionsError] = useState(false);
      const [selectedStoreId, setSelectedStoreId] = useState('');
      const [assignedInfo, setAssignedInfo] = useState(null); // { ojtName, storeName }
      const [submittingStart, setSubmittingStart] = useState(false);
      const [attempt, setAttempt] = useState(null); // { attemptId, attemptSecret }
      const [questions, setQuestions] = useState([]);
      const [qIndex, setQIndex] = useState(0);
      const [answers, setAnswers] = useState({}); // { [questionId]: value }
      const [saving, setSaving] = useState(false);
      const [autoScore, setAutoScore] = useState(null);

      // Muat daftar toko asli (sama seperti dropdown "Pilih Toko" di layar login) supaya OJT
      // yang mengerjakan lewat link umum/hasil share masal bisa MEMILIH toko yang benar-benar
      // ada di sistem, bukan ketik manual. Pakai endpoint publik yang sama dengan LoginScreen
      // (tidak perlu login/token). Tidak relevan untuk link per-OJT (assigned=true) karena
      // toko sudah ditentukan admin sejak link dibuat.
      useEffect(() => {
        if (assigned) return;
        (async () => {
          try {
            const res = await fetch(`${WORKER_BASE}/api/rtdb?path=storeDirectory`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const raw = data.value || {};
            const list = Object.keys(raw).map(id => ({ id, name: raw[id] })).sort((a, b) => a.name.localeCompare(b.name));
            setStoreOptions(list);
            setStoreOptionsError(list.length === 0);
          } catch (e) {
            setStoreOptionsError(true);
          }
        })();
      }, [assigned]);

      // Muat info paket psikotes (judul/deskripsi/terkunci) begitu halaman dibuka.
      useEffect(() => {
        (async () => {
          try {
            const res = await fetch(infoUrl);
            const data = await res.json();
            if (!res.ok) { setErrorMsg(data.error || 'Link tidak valid'); setPhase('error'); return; }
            setTest(data.test);
            if (assigned) setAssignedInfo({ ojtName: data.ojtName, storeName: data.storeName });
            // Kalau OJT sebelumnya sempat memulai (refresh halaman tanpa sengaja), lanjutkan
            // dari attempt yang sama, bukan mulai dari nol -- ambil dari localStorage.
            const saved = localStorage.getItem(storageKey);
            if (saved) {
              try {
                const parsed = JSON.parse(saved);
                const statusRes = await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${parsed.attemptId}/status?attemptSecret=${encodeURIComponent(parsed.attemptSecret)}`);
                const statusData = await statusRes.json();
                if (statusRes.ok) {
                  if (statusData.status === 'blocked') {
                    setAttempt(parsed);
                    // Pulihkan soal dari data tersimpan jika ada (untuk resume setelah unblock)
                    if (parsed.questions && parsed.questions.length > 0) {
                      setQuestions(parsed.questions);
                    }
                    setPhase('blocked');
                    return;
                  }
                  if (statusData.status === 'completed') { setPhase('done'); return; }
                  // Jika in_progress dan soal tersimpan, langsung lanjutkan mengerjakan
                  if (statusData.status === 'in_progress' && parsed.questions && parsed.questions.length > 0) {
                    setAttempt(parsed);
                    setQuestions(parsed.questions);
                    setPhase('taking');
                    return;
                  }
                }
              } catch (e) { /* kalau gagal cek, biarkan lanjut ke form biasa */ }
            }
            // Link per-OJT yang sudah dipakai (tapi tidak ada sesi tersimpan di browser ini,
            // berarti dibuka dari perangkat lain) -- tolak, supaya 1 link = 1 orang.
            if (assigned && data.alreadyUsed) {
              setErrorMsg('Link ini sudah pernah dipakai untuk memulai psikotes. Kalau ini bukan kamu, hubungi admin/toko.');
              setPhase('error');
              return;
            }
            if (data.test.locked) { setPhase('locked'); return; }
            setPhase(assigned ? 'confirm' : 'form');
          } catch (e) {
            setErrorMsg('Gagal memuat halaman psikotes. Periksa koneksi internet.');
            setPhase('error');
          }
        })();
      }, [linkToken]);

      const handleStart = async () => {
        if (!assigned && (!name.trim() || !selectedStoreId)) return;
        setSubmittingStart(true);
        try {
          // Nama toko yang dikirim diambil dari daftar resmi (bukan hasil ketikan bebas),
          // dicocokkan lewat storeId yang dipilih OJT di dropdown -- storeId inilah yang
          // dipakai server untuk menautkan skor ke toko yang benar.
          const chosenStoreName = (storeOptions.find(s => s.id === selectedStoreId) || {}).name || '';
          const res = await fetch(startUrl, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(assigned ? {} : { name: name.trim(), penempatan: chosenStoreName, storeId: selectedStoreId }),
          });
          const data = await res.json();
          if (!res.ok) { setErrorMsg(data.error || 'Gagal memulai psikotes'); setSubmittingStart(false); return; }
          const attemptInfo = { attemptId: data.attemptId, attemptSecret: data.attemptSecret, questions: data.questions };
          localStorage.setItem(storageKey, JSON.stringify(attemptInfo));
          setAttempt(attemptInfo);
          setQuestions(data.questions);
          setPhase('taking');
        } catch (e) {
          setErrorMsg('Gagal memulai psikotes. Periksa koneksi internet.');
        } finally {
          setSubmittingStart(false);
        }
      };

      // Deteksi OJT pindah tab / minimize app selama mengerjakan (fase 'taking').
      useEffect(() => {
        if (phase !== 'taking' || !attempt) return;
        const reportLeave = () => {
          navigator.sendBeacon
            ? navigator.sendBeacon(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/flag-leave`, new Blob([JSON.stringify({ attemptSecret: attempt.attemptSecret })], { type: 'application/json' }))
            : fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/flag-leave`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ attemptSecret: attempt.attemptSecret }), keepalive: true }).catch(() => {});
          setPhase('blocked');
        };
        const onVisibility = () => { if (document.hidden) reportLeave(); };
        document.addEventListener('visibilitychange', onVisibility);
        window.addEventListener('pagehide', reportLeave);
        return () => {
          document.removeEventListener('visibilitychange', onVisibility);
          window.removeEventListener('pagehide', reportLeave);
        };
      }, [phase, attempt]);

      // Selagi terblokir, cek berkala apakah admin sudah membuka blokirnya.
      useEffect(() => {
        if (phase !== 'blocked' || !attempt) return;
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/status?attemptSecret=${encodeURIComponent(attempt.attemptSecret)}`);
            const data = await res.json();
            if (res.ok && data.status === 'in_progress') {
              // Kalau soal belum ada di state (misal: halaman di-refresh saat diblokir),
              // coba pulihkan dari localStorage tempat soal disimpan saat pertama mulai.
              if (questions.length === 0) {
                try {
                  const saved = localStorage.getItem(storageKey);
                  if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.questions && parsed.questions.length > 0) {
                      setQuestions(parsed.questions);
                    }
                  }
                } catch (e) { /* gagal baca localStorage, soal mungkin sudah ada di state */ }
              }
              setPhase('taking');
            }
          } catch (e) { /* diamkan, coba lagi di interval berikutnya */ }
        }, 5000);
        return () => clearInterval(interval);
      }, [phase, attempt, questions]);

      const saveAnswer = async (questionId, value) => {
        setAnswers(prev => ({ ...prev, [questionId]: value }));
        try {
          await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/answer`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ attemptSecret: attempt.attemptSecret, questionId, answer: value }),
          });
        } catch (e) { /* best-effort; kalau gagal, jawaban lokal tetap kelihatan tersimpan di UI */ }
      };

      const handleFinish = async () => {
        setSaving(true);
        try {
          const res = await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/finish`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ attemptSecret: attempt.attemptSecret }),
          });
          const data = await res.json();
          if (res.ok) {
            setAutoScore(data.autoScore);
            localStorage.removeItem(storageKey);
            setPhase('done');
          } else {
            setErrorMsg(data.error || 'Gagal mengumpulkan jawaban');
          }
        } catch (e) {
          setErrorMsg('Gagal mengumpulkan jawaban. Periksa koneksi internet lalu coba lagi.');
        } finally {
          setSaving(false);
        }
      };

      const Shell = ({ children }) => (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 via-white to-indigo-50 flex items-center justify-center p-4">
          <div className="w-full max-w-md">{children}</div>
        </div>
      );

      if (phase === 'loading') {
        return <Shell><div className="text-center text-slate-500"><i data-lucide="loader" className="w-8 h-8 animate-spin mx-auto mb-2"></i>Memuat...</div></Shell>;
      }
      if (phase === 'error') {
        return <Shell><div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 text-center space-y-2">
          <i data-lucide="alert-triangle" className="w-10 h-10 text-rose-500 mx-auto"></i>
          <h2 className="font-bold text-slate-800">Tidak Bisa Membuka Psikotes</h2>
          <p className="text-sm text-slate-500">{errorMsg}</p>
        </div></Shell>;
      }
      if (phase === 'locked') {
        return <Shell><div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 text-center space-y-2">
          <i data-lucide="lock" className="w-10 h-10 text-amber-500 mx-auto"></i>
          <h2 className="font-bold text-slate-800">Psikotes Dikunci</h2>
          <p className="text-sm text-slate-500">Psikotes ini sedang dikunci oleh admin. Hubungi admin/toko untuk info lebih lanjut.</p>
        </div></Shell>;
      }
      if (phase === 'blocked') {
        return <Shell><div className="bg-white rounded-2xl border border-rose-200 shadow-sm p-6 text-center space-y-2">
          <i data-lucide="shield-alert" className="w-10 h-10 text-rose-500 mx-auto"></i>
          <h2 className="font-bold text-slate-800">Akses Diblokir</h2>
          <p className="text-sm text-slate-500">Kamu terdeteksi keluar dari halaman psikotes saat sedang mengerjakan. Hubungi admin/toko untuk membuka blokir. Halaman ini akan otomatis lanjut begitu diizinkan.</p>
        </div></Shell>;
      }
      if (phase === 'done') {
        return <Shell><div className="bg-white rounded-2xl border border-emerald-200 shadow-sm p-6 text-center space-y-2">
          <i data-lucide="check-circle-2" className="w-10 h-10 text-emerald-500 mx-auto"></i>
          <h2 className="font-bold text-slate-800">Psikotes Selesai</h2>
          <p className="text-sm text-slate-500">Terima kasih, jawabanmu sudah tersimpan. Hasilnya akan direview oleh admin/toko.</p>
        </div></Shell>;
      }
      if (phase === 'confirm') {
        // Link per-OJT dari admin: nama & toko sudah pasti (read-only), tidak ada form isian.
        return <Shell><div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
          <div className="text-center space-y-1">
            <i data-lucide="clipboard-list" className="w-9 h-9 text-purple-700 mx-auto"></i>
            <h2 className="font-bold text-slate-800 text-lg">{test?.title}</h2>
            {test?.description && <p className="text-xs text-slate-500">{test.description}</p>}
          </div>
          <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-1.5">

            <div className="flex justify-between text-xs"><span className="text-slate-500">Penempatan Toko</span><span className="font-semibold text-slate-800">{assignedInfo?.storeName}</span></div>
          </div>
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
            Setelah mulai, jangan pindah tab/aplikasi lain sampai selesai — kalau keluar, akses akan otomatis diblokir dan butuh izin admin untuk dibuka lagi. Link ini hanya bisa dipakai satu kali.
          </div>
          {errorMsg && <p className="text-xs text-rose-600">{errorMsg}</p>}
          <button onClick={handleStart} disabled={submittingStart} className="w-full bg-purple-800 hover:bg-purple-900 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm">
            {submittingStart ? 'Memulai...' : 'Mulai Psikotes'}
          </button>
        </div></Shell>;
      }
      if (phase === 'form') {
        return <Shell><div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
          <div className="text-center space-y-1">
            <i data-lucide="clipboard-list" className="w-9 h-9 text-purple-700 mx-auto"></i>
            <h2 className="font-bold text-slate-800 text-lg">{test?.title}</h2>
            {test?.description && <p className="text-xs text-slate-500">{test.description}</p>}
          </div>
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
            Setelah mulai, jangan pindah tab/aplikasi lain sampai selesai — kalau keluar, akses akan otomatis diblokir dan butuh izin admin untuk dibuka lagi.
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-600">Nama Lengkap</label>
            <input value={name} onChange={e => setName(e.target.value)} className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" placeholder="Nama kamu" />
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-600">Lokasi Penempatan (Toko)</label>
            <select value={selectedStoreId} onChange={e => setSelectedStoreId(e.target.value)} disabled={storeOptions.length === 0} className="mt-1 w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-white disabled:bg-slate-50 disabled:text-slate-400">
              <option value="">{storeOptions.length === 0 ? (storeOptionsError ? 'Gagal memuat daftar toko' : 'Memuat daftar toko...') : '-- Pilih Toko --'}</option>
              {storeOptions.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <p className="text-[11px] text-slate-400 mt-1">Pilih toko yang sesuai supaya skor kamu otomatis muncul di akun toko tersebut.</p>
            {storeOptionsError && (
              <p className="text-[11px] text-rose-500 mt-1">Daftar toko gagal dimuat. Periksa koneksi internet lalu muat ulang halaman ini.</p>
            )}
          </div>
          {errorMsg && <p className="text-xs text-rose-600">{errorMsg}</p>}
          <button onClick={handleStart} disabled={submittingStart || !name.trim() || !selectedStoreId} className="w-full bg-purple-800 hover:bg-purple-900 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm">
            {submittingStart ? 'Memulai...' : 'Mulai Psikotes'}
          </button>
        </div></Shell>;
      }

      // phase === 'taking'
      const q = questions[qIndex];
      const allAnswered = questions.every(qq => answers[qq.id] !== undefined && answers[qq.id] !== '');
      return (
        <div className="min-h-screen bg-slate-50 p-4">
          <div className="max-w-md mx-auto space-y-4">
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sticky top-4 z-10">
              <div className="flex items-center justify-between text-xs text-slate-500 mb-2">
                <span>Soal {qIndex + 1} dari {questions.length}</span>
                <span>{Object.keys(answers).length}/{questions.length} terjawab</span>
              </div>
              <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div className="h-full bg-purple-700 rounded-full transition-all" style={{ width: `${((qIndex + 1) / questions.length) * 100}%` }}></div>
              </div>
            </div>

            {q && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                <p className="font-semibold text-slate-800 text-sm whitespace-pre-wrap">{q.text}</p>
                {q.type === 'pilihan_ganda' ? (
                  <div className="space-y-2">
                    {q.options.map((opt, i) => (
                      <button key={i} onClick={() => saveAnswer(q.id, String(i))}
                        className={`w-full text-left px-3 py-2.5 rounded-xl text-sm border transition-all ${String(answers[q.id]) === String(i) ? 'bg-purple-800 text-white border-purple-800' : 'border-slate-200 text-slate-700 hover:bg-slate-50'}`}>
                        {opt}
                      </button>
                    ))}
                  </div>
                ) : (
                  <textarea value={answers[q.id] || ''} onChange={e => saveAnswer(q.id, e.target.value)} rows={4}
                    className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm" placeholder="Tulis jawabanmu di sini..." />
                )}
              </div>
            )}

            <div className="flex gap-2">
              <button onClick={() => setQIndex(i => Math.max(0, i - 1))} disabled={qIndex === 0}
                className="flex-1 bg-white border border-slate-200 disabled:opacity-40 text-slate-700 font-semibold py-2.5 rounded-xl text-sm">Sebelumnya</button>
              {qIndex < questions.length - 1 ? (
                <button onClick={() => setQIndex(i => Math.min(questions.length - 1, i + 1))}
                  className="flex-1 bg-purple-800 hover:bg-purple-900 text-white font-semibold py-2.5 rounded-xl text-sm">Selanjutnya</button>
              ) : (
                <button onClick={handleFinish} disabled={saving || !allAnswered}
                  className="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold py-2.5 rounded-xl text-sm">
                  {saving ? 'Mengirim...' : 'Kumpulkan Jawaban'}
                </button>
              )}
            </div>
            {!allAnswered && qIndex === questions.length - 1 && (
              <p className="text-xs text-center text-slate-400">Jawab semua soal dulu sebelum mengumpulkan.</p>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // ADMIN: Tab "Psikotes OJT" -- kelola paket psikotes, soal, dan hasil OJT
    // ==========================================
    function AdminPsikotesTab({ stores }) {
      const [tests, setTests] = useState([]);

      // CORS/koneksi bermasalah di APK), tab ini diam saja tanpa keterangan apa pun -- pengguna
      // melihat tab "kosong"/tidak merespons dan mengiranya error. Sekarang kegagalan ditangkap &
      // ditampilkan jelas + ada tombol coba lagi.
      const [showCreate, setShowCreate] = useState(false);

      const [newDesc, setNewDesc] = useState('');
