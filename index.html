  <!-- Loader Tailwind CDN dengan AUTO-RETRY (ditambahkan 2026-09): kalau gagal dimuat
       karena jaringan lambat/putus (bukan diblokir CSP), otomatis dicoba ulang sampai
       4 kali dengan jeda makin lama, sebelum akhirnya menampilkan tombol "Muat Ulang"
       kalau memang semua percobaan gagal. Ini supaya tampilan tidak langsung polos
       gara-gara satu kali gagal fetch seperti kemarin. -->
  <script>
    (function () {
      // Beberapa jaringan/ISP (terutama filter DNS di Indonesia) salah mengklasifikasikan
      // domain cdn.tailwindcss.com sebagai situs "gambling" dan memblokirnya di level DNS —
      // ini masalah yang sudah dikenal luas, bukan soal server Tailwind down. Koneksi bisa
      // saja cepat & normal, tapi domain SPESIFIK ini tetap gagal di-resolve.
      //
      // Solusinya: sediakan SUMBER CADANGAN dari domain lain (unpkg.com, yang sudah
      // whitelisted di CSP situs ini) yang meng-hosting file identik lewat paket npm
      // "tailwindcss-cdn". Kalau sumber utama gagal berkali-kali, otomatis pindah ke
      // sumber cadangan — jadi tetap jalan meski domain utamanya diblokir jaringan.
      var SOURCES = [
        'https://cdn.tailwindcss.com',
        'https://unpkg.com/tailwindcss-cdn@3.4.10/tailwindcss.js'
      ];
      var RETRY_PER_SOURCE = 2;
      var sourceIndex = 0;
      var attempt = 0;

      function loadTailwindCDN() {
        attempt++;
        var s = document.createElement('script');
        var base = SOURCES[sourceIndex];
        var sep = base.indexOf('?') === -1 ? '?' : '&';
        // parameter retry di URL cuma buat cache-busting supaya browser tidak
        // memakai ulang response gagal/parsial yang mungkin sempat ke-cache.
        s.src = base + sep + 'retry=' + attempt;
        s.crossOrigin = 'anonymous';
        s.onerror = function () {
          if (attempt < RETRY_PER_SOURCE) {
            setTimeout(loadTailwindCDN, attempt * 1000); // jeda 1s, 2s, ...
          } else if (sourceIndex < SOURCES.length - 1) {
            // sumber ini sudah dicoba beberapa kali & tetap gagal -> pindah ke cadangan
            sourceIndex++;
            attempt = 0;
            loadTailwindCDN();
          } else {
            showReloadBanner();
          }
        };
        document.head.appendChild(s);
      }

      function showReloadBanner() {
        function append() {
          var b = document.createElement('div');
          b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:999999;' +
            'background:#B91C1C;color:#fff;padding:10px 14px;font-family:sans-serif;' +
            'font-size:13px;text-align:center;';
          b.innerHTML = 'Gagal memuat tampilan (koneksi bermasalah). ' +
            '<button onclick="location.reload()" style="margin-left:8px;background:#fff;' +
            'color:#B91C1C;border:none;padding:4px 10px;border-radius:4px;font-weight:600;">' +
            'Muat Ulang</button>';
          document.body.appendChild(b);
        }
        if (document.body) { append(); } else { document.addEventListener('DOMContentLoaded', append); }
      }

      // PERBAIKAN (2026-10): gaya Tailwind sekarang dari file statis tailwind.css (dibuat sekali saat build,
      // sama persis hasilnya, tanpa menunggu CDN & tanpa kompilasi di HP) -> tampilan tidak bisa "polos"
      // lagi gara-gara CDN lambat/diblokir. CDN ini TIDAK dimuat lagi kecuali tailwind.css gagal dimuat
      // (lihat onerror pada <link> tailwind.css di bawah), sebagai cadangan terakhir.
      window.__tbLoadTailwindCDN = loadTailwindCDN;
    })();
  </script>

    /* ========================================== */

    /* ========================================== */
    /* Area cetak disembunyikan di layar (hanya dipakai saat dialog print browser
       terbuka). Trik "sembunyikan semua, tampilkan area cetak saja" ini bekerja di
       SEMUA jenis printer (biasa/laser/inkjet/A4) MAUPUN printer thermal (58mm/80mm)

    #thermalPrintArea { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      #thermalPrintArea, #thermalPrintArea * { visibility: visible !important; }

<script>
  // ==========================================
  // FIX: konflik lucide.createIcons() vs React DOM reconciliation
  // ==========================================
  // lucide.createIcons() mengganti elemen <i data-lucide="..."> LANGSUNG di DOM nyata
  // (di luar sepengetahuan React) menjadi <svg>. React tetap menyimpan elemen <i> lama
  // di Fiber tree miliknya. Begitu React nanti perlu menghapus/memindah bagian itu (mis.
  // tab berpindah, list berubah, komponen unmount), React memanggil
  // parentNode.removeChild(elemenLamaYangSudahDiganti) -- tapi elemen itu SUDAH TIDAK ADA
  // di DOM (sudah diganti Lucide), sehingga browser melempar:
  //   "NotFoundError: Failed to execute 'removeChild' on 'Node': The node to be removed
  //    is not a child of this node."
  // Ini SELALU tertangkap oleh AppErrorBoundary sebagai "kendala tampilan" walau
  // sebenarnya tidak ada bug pada data/logika aplikasi sama sekali -- murni konflik dua
  // library yang sama-sama memanipulasi DOM.
  //
  // Perbaikan MENYELURUH (mengganti seluruh ikon jadi komponen React lucide-react) butuh
  // menyentuh ribuan baris JSX, terlalu berisiko dilakukan sekaligus. Solusi standar &
  // aman yang dipakai di sini: buat removeChild/insertBefore "defensif" -- kalau node yang
  // diminta dihapus/disisipkan TERNYATA bukan child dari parent tsb (karena sudah
  // diubah pihak lain di luar React), JANGAN lempar error, cukup diam saja (tidak ada apa
  // pun yang perlu dihapus/dipindah lagi). Ini tidak mengubah tampilan/perilaku apa pun
  // yang terlihat pengguna -- hanya mencegah crash akibat DOM sudah berubah duluan.
  (function () {
    const origRemoveChild = Node.prototype.removeChild;
    Node.prototype.removeChild = function (child) {
      if (child.parentNode !== this) {
        if (console && console.warn) {
          console.warn('[Tarobun] Diabaikan: removeChild pada node yang sudah tidak jadi child (biasanya akibat lucide.createIcons()).', child);
        }
        return child;
      }
      return origRemoveChild.call(this, child);
    };

    const origInsertBefore = Node.prototype.insertBefore;
    Node.prototype.insertBefore = function (newNode, refNode) {
      if (refNode && refNode.parentNode !== this) {
        if (console && console.warn) {
          console.warn('[Tarobun] Diabaikan: insertBefore dengan referenceNode yang sudah tidak jadi child (biasanya akibat lucide.createIcons()).', refNode);
        }
        return this.appendChild(newNode);
      }
      return origInsertBefore.call(this, newNode, refNode);
    };
  })();
</script>
