<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investory</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<style>
  :root { --purple: #6D28D9; --purple-dark: #5B21B6; --red: #DC2626; --green:#16A34A; --bg:#F4F4F7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:#1e1b2e; }
  header { background:var(--purple); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.85; }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  label { display:block; font-size:12px; font-weight:600; color:#4b5563; margin: 10px 0 4px; }
  select, input, button { width:100%; padding:11px 12px; border-radius:10px; border:1px solid #d8d8e0; font-size:15px; }
  button.primary { background:var(--purple); color:#fff; border:none; font-weight:700; margin-top:16px; cursor:pointer; }
  button.primary:active { background:var(--purple-dark); }
  button.primary:disabled { opacity:.5; }
  .msg { font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:10px; display:none; }
  .msg.ok { background:#dcfce7; color:#166534; display:block; }
  .msg.err { background:#fee2e2; color:#991b1b; display:block; }
  .item-row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #f0f0f4; font-size:13.5px; }
  .item-row:last-child { border-bottom:none; }
  .item-row .meta { color:#6b7280; font-size:11.5px; }
  .badge-low { background:var(--red); color:#fff; font-size:10px; padding:2px 7px; border-radius:99px; margin-left:6px; }
  .empty { text-align:center; color:#9ca3af; font-size:13px; padding: 14px 0; }
  h2.section { font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:#6b7280; margin: 0 0 8px; }
  .loc-group { margin-bottom: 4px; }
  .loc-group:last-child { margin-bottom: 0; }
  .loc-head { font-size:12.5px; font-weight:700; color:var(--purple); background:#f3e8ff; padding:6px 10px; border-radius:8px; margin: 12px 0 4px; }
  .loc-group:first-child .loc-head { margin-top: 0; }
  .loc-empty { text-align:center; color:#b7b7c2; font-size:12px; padding: 8px 0; }
  .del-btn { border:none; background:#fee2e2; color:var(--red); width:26px; height:26px; min-width:26px; border-radius:8px; font-size:16px; line-height:1; cursor:pointer; padding:0; flex-shrink:0; }
  .del-btn:active { background:#fecaca; }
  .row-right { display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>

<header>
  <h1 id="storeName">Investory</h1>
  <p>Pencatatan stok freezer &amp; chiller</p>
</header>

<main>
  <div id="loadMsg" class="msg"></div>

  <div class="card" id="formCard" style="display:none">
    <h2 class="section">Catat Stok Baru</h2>
    <div id="formMsg" class="msg"></div>

    <label>Tempat</label>
    <select id="fLocation"></select>

    <label>Barang</label>
    <select id="fItem"></select>

    <div style="display:flex; gap:10px;">
      <div style="flex:1">
        <label>Jumlah</label>
        <input type="number" id="fQty" min="0" step="0.01" inputmode="decimal" placeholder="0">
      </div>
      <div style="flex:1">
        <label>Satuan</label>
        <select id="fUnit"></select>
      </div>
    </div>

    <label>Tanggal ED (opsional)</label>
    <input type="date" id="fExpiry">

    <label>Nama Pencatat (opsional)</label>
    <input type="text" id="fRecordedBy" placeholder="Nama kamu" maxlength="100">

    <button class="primary" id="submitBtn">Simpan Catatan</button>
  </div>

  <div class="card" id="listCard" style="display:none">
    <h2 class="section">Stok Saat Ini</h2>
    <div id="listBody"></div>
  </div>
</main>

<script>
(function () {
  var WORKER_BASE = 'https://tarobun-api.tepangbkj8.workers.dev';
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token') || params.get('t') || '';

  var loadMsg = document.getElementById('loadMsg');
  var formCard = document.getElementById('formCard');
  var listCard = document.getElementById('listCard');
  var listBody = document.getElementById('listBody');
  var formMsg = document.getElementById('formMsg');
  var storeNameEl = document.getElementById('storeName');

  function showMsg(el, text, kind) {
    el.textContent = text;
    el.className = 'msg ' + kind;
  }

  function fillSelect(sel, options) {
    sel.innerHTML = '';
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      sel.appendChild(o);
    });
  }

  var currentLocations = [];

  function renderList(summary, locations) {
    listBody.innerHTML = '';
    var locs = (locations && locations.length) ? locations : currentLocations;
    var byLoc = {};
    locs.forEach(function (loc) { byLoc[loc] = []; });
    (summary || []).forEach(function (r) {
      if (!byLoc[r.location]) byLoc[r.location] = [];
      byLoc[r.location].push(r);
    });

    locs.forEach(function (loc) {
      var group = document.createElement('div');
      group.className = 'loc-group';

      var head = document.createElement('div');
      head.className = 'loc-head';
      head.textContent = loc;
      group.appendChild(head);

      var items = byLoc[loc] || [];
      if (items.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'loc-empty';
        empty.textContent = 'Belum ada catatan.';
        group.appendChild(empty);
      } else {
        items.forEach(function (r) {
          group.appendChild(buildRow(r));
        });
      }
      listBody.appendChild(group);
    });
  }

  function buildRow(r) {
    var row = document.createElement('div');
    row.className = 'item-row';

    var left = document.createElement('div');
    var line1 = document.createElement('div');
    line1.textContent = r.item;
    if (r.isLow) {
      var badge = document.createElement('span');
      badge.className = 'badge-low';
      badge.textContent = 'MENIPIS';
      line1.appendChild(badge);
    }
    var line2 = document.createElement('div');
    line2.className = 'meta';
    line2.textContent = r.expiry_date ? ('ED ' + r.expiry_date) : '';
    left.appendChild(line1);
    left.appendChild(line2);

    var right = document.createElement('div');
    right.className = 'row-right';
    var qty = document.createElement('div');
    qty.style.fontWeight = '700';
    qty.textContent = r.qty + ' ' + r.unit;

    var delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.type = 'button';
    delBtn.title = 'Hapus';
    delBtn.textContent = '\u00d7';
    delBtn.addEventListener('click', function () { handleDelete(r, delBtn); });

    right.appendChild(qty);
    right.appendChild(delBtn);

    row.appendChild(left);
    row.appendChild(right);
    return row;
  }

  function handleDelete(r, btn) {
    var ok = window.confirm('Hapus semua catatan "' + r.item + '" di ' + r.location + '? Riwayat sebelumnya untuk barang ini juga akan terhapus.');
    if (!ok) return;
    btn.disabled = true;
    fetch(WORKER_BASE + '/api/investory/public/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, location: r.location, item: r.item }),
    })
      .then(function (resp) { return resp.json().then(function (d) { return { ok: resp.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.ok) {
          showMsg(formMsg, (res.d && res.d.error) || 'Gagal menghapus catatan.', 'err');
          btn.disabled = false;
          return;
        }
        return fetch(WORKER_BASE + '/api/investory/public/info?token=' + encodeURIComponent(token))
          .then(function (resp2) { return resp2.json(); })
          .then(function (d2) { if (d2.ok) renderList(d2.summary, d2.locations); });
      })
      .catch(function () {
        showMsg(formMsg, 'Gagal terhubung ke server.', 'err');
        btn.disabled = false;
      });
  }

  if (!token) {
    showMsg(loadMsg, 'Link tidak valid. Pastikan kamu membuka link Investory yang lengkap.', 'err');
    return;
  }

  fetch(WORKER_BASE + '/api/investory/public/info?token=' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      if (!res.ok || !res.d.ok) {
        showMsg(loadMsg, (res.d && res.d.error) || 'Gagal memuat data.', 'err');
        return;
      }
      var data = res.d;
      storeNameEl.textContent = 'Investory — ' + data.storeName;
      currentLocations = data.locations || [];
      fillSelect(document.getElementById('fLocation'), data.locations);
      fillSelect(document.getElementById('fItem'), data.items);
      fillSelect(document.getElementById('fUnit'), data.units);
      renderList(data.summary, data.locations);
      formCard.style.display = 'block';
      listCard.style.display = 'block';
    })
    .catch(function () {
      showMsg(loadMsg, 'Gagal terhubung ke server. Cek koneksi internet kamu.', 'err');
    });

  document.getElementById('submitBtn').addEventListener('click', function () {
    var btn = this;
    var body = {
      token: token,
      location: document.getElementById('fLocation').value,
      item: document.getElementById('fItem').value,
      qty: document.getElementById('fQty').value,
      unit: document.getElementById('fUnit').value,
      expiryDate: document.getElementById('fExpiry').value || null,
      recordedBy: document.getElementById('fRecordedBy').value || null,
    };
    if (!body.qty || Number(body.qty) < 0) {
      showMsg(formMsg, 'Isi jumlah barang terlebih dahulu.', 'err');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';
    fetch(WORKER_BASE + '/api/investory/public/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        btn.disabled = false;
        btn.textContent = 'Simpan Catatan';
        if (!res.ok || !res.d.ok) {
          showMsg(formMsg, (res.d && res.d.error) || 'Gagal menyimpan catatan.', 'err');
          return;
        }
        showMsg(formMsg, 'Catatan berhasil disimpan & terkirim ke Telegram.', 'ok');
        document.getElementById('fQty').value = '';
        document.getElementById('fExpiry').value = '';
        // Muat ulang daftar stok terkini
        fetch(WORKER_BASE + '/api/investory/public/info?token=' + encodeURIComponent(token))
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d.ok) renderList(d.summary, d.locations); });
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Simpan Catatan';
        showMsg(formMsg, 'Gagal terhubung ke server.', 'err');
      });
  });
})();
</script>

</body>
</html>
