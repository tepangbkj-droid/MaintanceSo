<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Investory — Tarobun</title>
  <meta name="description" content="Pencatatan stok freezer & chiller Tarobun secara real-time." />
  <meta name="robots" content="noindex, nofollow, noarchive" />

  <!-- PWA -->
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <meta name="theme-color" content="#6D28D9" />

  <!-- React + Babel + Tailwind -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" defer></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" defer></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.js" defer></script>
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="https://unpkg.com/lucide@latest" defer crossorigin="anonymous"></script>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/inter@5.0.16/400.css" />
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/inter@5.0.16/600.css" />
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/inter@5.0.16/700.css" />
  <link rel="stylesheet" href="https://unpkg.com/@fontsource/plus-jakarta-sans@5.0.16/700.css" />

  <script>
    window.addEventListener('load', function () {
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { purple: '#6D28D9', 50: '#F5F3FF', 100: '#EDE9FE', 700: '#6D28D9', 800: '#5B21B6', 900: '#3B1370' },
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'sans-serif'],
            },
          }
        }
      };
    });
  </script>

  <style>
    html, body { max-width: 100%; overflow-x: hidden; scroll-behavior: smooth; }
    * { overflow-wrap: break-word; word-break: break-word; scrollbar-width: thin; scrollbar-color: #C4B5FD transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { -webkit-font-smoothing: antialiased; line-height: 1.55; }
    input, button, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button { transition: transform 0.12s ease, opacity 0.12s ease; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { cursor: not-allowed; }
    ::selection { background-color: #DDD6FE; color: #3B1370; }

    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.92) } to { opacity: 1; transform: scale(1) } }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out both; }
    .animate-scaleIn { animation: scaleIn 0.22s cubic-bezier(0.34,1.56,0.64,1) both; }

    @keyframes shimmer { 100% { transform: translateX(100%); } }
    .skeleton { position: relative; overflow: hidden; background: #EDE9FE; border-radius: 8px; }
    .skeleton::after { content:''; position:absolute; inset:0; transform:translateX(-100%);
      background: linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);
      animation: shimmer 1.5s ease-in-out infinite; }

    /* Hapus border dari .grid/.flex global yang bisa merusak layout */
    .grid, .flex { contain: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// =====================================================================
// KONFIGURASI — SESUAIKAN DENGAN WORKER ANDA
// =====================================================================
const WORKER_BASE = 'https://tarobun-api.tepangbkj8.workers.dev';

// =====================================================================
// KONSTANTA BARANG & LOKASI
// =====================================================================
const ITEMS = [
  { key: 'frozenDough',   label: 'Frozen Dough',   defaultUnit: 'bag'  },
  { key: 'coklat',        label: 'Coklat',          defaultUnit: 'bag'  },
  { key: 'vanilla',       label: 'Vanilla',         defaultUnit: 'bag'  },
  { key: 'rasberi',       label: 'Rasberi',         defaultUnit: 'bag'  },
  { key: 'peach',         label: 'Peach',           defaultUnit: 'bag'  },
  { key: 'nanas',         label: 'Nanas',           defaultUnit: 'bag'  },
  { key: 'whippingCream', label: 'Whipping Cream',  defaultUnit: 'bag'  },
  { key: 'esBatu',        label: 'Es Batu',         defaultUnit: 'pcs'  },
];
const LOCATIONS = ['Freezer 1', 'Freezer 2', 'Chiller Bawah', 'Chiller Atas'];
const UNITS = ['bag', 'pcs'];

// Ambang batas stok menipis
function getThreshold(itemKey, unit) {
  if (itemKey === 'frozenDough') return { val: 10, unit: 'bag' };
  if (unit === 'pcs') return { val: 15, unit: 'pcs' };
  return { val: 2, unit: 'bag' };
}
function isLowStock(entry) {
  const item = ITEMS.find(i => i.label === entry.namaBarang || i.key === entry.itemKey);
  if (!item) return false;
  const th = getThreshold(item.key, entry.satuan);
  return parseFloat(entry.jumlah) < th.val;
}
function isExpiringSoon(ed) {
  if (!ed) return false;
  const diff = (new Date(ed + 'T00:00:00') - new Date()) / (1000 * 60 * 60 * 24);
  return diff >= 0 && diff <= 1;
}
function isExpired(ed) {
  if (!ed) return false;
  return new Date(ed + 'T00:00:00') < new Date(new Date().toDateString());
}

// =====================================================================
// UTILITAS
// =====================================================================
function fmtDate(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function fmtDateShort(dateStr) {
  if (!dateStr) return '-';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// =====================================================================
// API FETCH
// =====================================================================
async function apiFetch(path, opts = {}) {
  const res = await fetch(WORKER_BASE + path, {
    credentials: 'include',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'Request gagal');
  }
  return res.json();
}

// GET investory entries (publik dengan token, atau via session)
async function fetchEntries(storeId, token) {
  const q = token ? `?storeId=${storeId}&token=${encodeURIComponent(token)}` : `?storeId=${storeId}`;
  return apiFetch(`/api/investory${q}`, { credentials: token ? 'omit' : 'include' });
}
async function saveEntry(storeId, entry) {
  return apiFetch('/api/investory', { method: 'POST', body: JSON.stringify({ storeId, ...entry }) });
}
async function deleteEntry(storeId, entryId) {
  return apiFetch(`/api/investory/${entryId}?storeId=${storeId}`, { method: 'DELETE' });
}

// =====================================================================
// KOMPONEN UTAMA
// =====================================================================

// ── Toast ──────────────────────────────────────────────────────────────
function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 3000); return () => clearTimeout(t); }, []);
  const bg = type === 'error' ? 'bg-rose-600' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-600';
  return (
    <div className={`fixed bottom-20 left-1/2 -translate-x-1/2 z-50 ${bg} text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-lg animate-fadeIn max-w-xs text-center`}>
      {msg}
    </div>
  );
}

// ── Badge Stok / ED ────────────────────────────────────────────────────
function StatusBadge({ entry }) {
  const expired = isExpired(entry.ed);
  const expSoon = !expired && isExpiringSoon(entry.ed);
  const low = isLowStock(entry);
  if (expired) return <span className="text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-full">KADALUARSA</span>;
  if (expSoon) return <span className="text-[10px] font-bold bg-amber-100 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-full">⚠ ED Besok</span>;
  if (low) return <span className="text-[10px] font-bold bg-orange-100 text-orange-700 border border-orange-200 px-2 py-0.5 rounded-full">🔴 Stok Menipis</span>;
  return <span className="text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full">OK</span>;
}

// ── Kartu Entri ────────────────────────────────────────────────────────
function EntryCard({ entry, canEdit, onEdit, onDelete }) {
  const expired = isExpired(entry.ed);
  const expSoon = isExpiringSoon(entry.ed);
  const low = isLowStock(entry);
  const borderColor = expired || expSoon ? 'border-amber-300' : low ? 'border-orange-300' : 'border-slate-200';
  return (
    <div className={`bg-white rounded-2xl border ${borderColor} p-3.5 space-y-1.5 animate-fadeIn`}>
      <div className="flex items-start justify-between gap-2">
        <div>
          <p className="font-bold text-slate-800 text-sm">{entry.namaBarang}</p>
          <p className="text-xs text-slate-500">{entry.lokasi}</p>
        </div>
        <StatusBadge entry={entry} />
      </div>
      <div className="flex items-center gap-3 text-xs text-slate-700">
        <span className="font-semibold text-base text-slate-800">{entry.jumlah}</span>
        <span className="text-slate-400">{entry.satuan}</span>
        {entry.ed && (
          <span className={`ml-auto ${expired ? 'text-rose-600 font-bold' : expSoon ? 'text-amber-600 font-semibold' : 'text-slate-400'}`}>
            ED: {fmtDateShort(entry.ed)}
          </span>
        )}
      </div>
      <div className="flex items-center justify-between pt-0.5">
        <p className="text-[10px] text-slate-400">Dicatat: {fmtDate(entry.updatedAt)}</p>
        {canEdit && (
          <div className="flex gap-1">
            <button onClick={() => onEdit(entry)} className="p-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-purple-50 hover:text-purple-700">
              <i data-lucide="pencil" className="w-3.5 h-3.5"></i>
            </button>
            <button onClick={() => onDelete(entry)} className="p-1.5 rounded-lg bg-slate-100 text-rose-500 hover:bg-rose-50">
              <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Form Tambah/Edit ───────────────────────────────────────────────────
const EMPTY_FORM = { namaBarang: ITEMS[0].label, itemKey: ITEMS[0].key, lokasi: LOCATIONS[0], jumlah: '', satuan: 'bag', ed: todayStr(), entryId: null };
function EntryForm({ initial, storeId, onSaved, onCancel }) {
  const [form, setForm] = useState(initial || EMPTY_FORM);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  function pickItem(label) {
    const item = ITEMS.find(i => i.label === label);
    setForm(f => ({ ...f, namaBarang: label, itemKey: item ? item.key : '', satuan: item ? item.defaultUnit : 'bag' }));
  }

  async function handleSubmit(e) {
    e.preventDefault();
    setErr('');
    if (!form.jumlah || isNaN(parseFloat(form.jumlah))) { setErr('Jumlah harus diisi'); return; }
    setSaving(true);
    try {
      await saveEntry(storeId, form);
      onSaved();
    } catch (ex) { setErr(ex.message); }
    finally { setSaving(false); }
  }

  return (
    <div className="fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fadeIn">
      <div className="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-2xl p-5 space-y-3 animate-scaleIn">
        <div className="flex items-center justify-between">
          <h2 className="font-bold text-slate-800 font-display">{form.entryId ? 'Edit Catatan' : 'Tambah Catatan'}</h2>
          <button onClick={onCancel} className="p-1 text-slate-400"><i data-lucide="x" className="w-5 h-5"></i></button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-3">
          <div>
            <label className="text-xs font-semibold text-slate-600 mb-1 block">Barang</label>
            <select value={form.namaBarang} onChange={e => pickItem(e.target.value)}
              className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:border-purple-500 focus:outline-none">
              {ITEMS.map(i => <option key={i.key} value={i.label}>{i.label}</option>)}
            </select>
          </div>

          <div>
            <label className="text-xs font-semibold text-slate-600 mb-1 block">Lokasi Penyimpanan</label>
            <select value={form.lokasi} onChange={e => setForm(f => ({ ...f, lokasi: e.target.value }))}
              className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:border-purple-500 focus:outline-none">
              {LOCATIONS.map(l => <option key={l} value={l}>{l}</option>)}
            </select>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Jumlah</label>
              <input type="number" min="0" step="any" value={form.jumlah} onChange={e => setForm(f => ({ ...f, jumlah: e.target.value }))}
                placeholder="0" required
                className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-purple-500 focus:outline-none" />
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-600 mb-1 block">Satuan</label>
              <select value={form.satuan} onChange={e => setForm(f => ({ ...f, satuan: e.target.value }))}
                className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white focus:border-purple-500 focus:outline-none">
                {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
              </select>
            </div>
          </div>

          <div>
            <label className="text-xs font-semibold text-slate-600 mb-1 block">Expired Date (ED)</label>
            <input type="date" value={form.ed} onChange={e => setForm(f => ({ ...f, ed: e.target.value }))}
              className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:border-purple-500 focus:outline-none" />
          </div>

          {err && <p className="text-xs text-rose-600 font-semibold">{err}</p>}

          <div className="flex gap-2 pt-1">
            <button type="button" onClick={onCancel} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-sm">Batal</button>
            <button type="submit" disabled={saving} className="flex-1 bg-purple-800 disabled:opacity-50 text-white font-bold py-2.5 rounded-xl text-sm">
              {saving ? 'Menyimpan...' : form.entryId ? 'Simpan Perubahan' : 'Tambah'}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ── Alert Panel (untuk toko & leader) ─────────────────────────────────
function AlertPanel({ entries }) {
  const alerts = entries.filter(e => isLowStock(e) || isExpiringSoon(e) || isExpired(e));
  if (alerts.length === 0) return null;
  return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-2">
      <h3 className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
        <i data-lucide="alert-triangle" className="w-4 h-4"></i> Perhatian Stok
      </h3>
      {alerts.map((e, i) => {
        const expired = isExpired(e.ed);
        const expSoon = isExpiringSoon(e.ed);
        const low = isLowStock(e);
        const item = ITEMS.find(ii => ii.label === e.namaBarang || ii.key === e.itemKey);
        const th = item ? getThreshold(item.key, e.satuan) : null;
        return (
          <div key={e.id || i} className="flex items-start gap-2">
            <span className="text-base leading-none">{expired ? '🔴' : expSoon ? '⚠️' : '🟠'}</span>
            <p className="text-xs text-amber-800">
              <b>{e.namaBarang}</b> ({e.lokasi}){' '}
              {expired && `— SUDAH KADALUARSA (${fmtDateShort(e.ed)})`}
              {expSoon && !expired && `— ED besok! (${fmtDateShort(e.ed)})`}
              {low && !expired && !expSoon && `— Stok menipis: ${e.jumlah} ${e.satuan} (batas ${th ? th.val + ' ' + th.unit : '-'})`}
              {low && expSoon && ' & stok menipis!'}
            </p>
          </div>
        );
      })}
      <p className="text-[10px] text-amber-600 font-medium pt-1">Segera lakukan isi ulang atau disposal sesuai SOP.</p>
    </div>
  );
}

// ── App Utama ──────────────────────────────────────────────────────────
function App() {
  // Ambil storeId & token dari URL (untuk akses publik)
  const params = new URLSearchParams(window.location.search);
  const urlStoreId = params.get('store') || '';
  const urlToken   = params.get('token') || '';

  // Mode: 'public' (via token URL) atau 'authenticated' (via session cookie)
  const mode = urlToken ? 'public' : 'authenticated';

  const [storeId, setStoreId]       = useState(urlStoreId);
  const [token]                      = useState(urlToken);
  const [entries, setEntries]        = useState([]);
  const [loading, setLoading]        = useState(false);
  const [err, setErr]                = useState('');
  const [toast, setToast]            = useState(null);
  const [showForm, setShowForm]      = useState(false);
  const [editEntry, setEditEntry]    = useState(null);
  const [filterLoc, setFilterLoc]    = useState('Semua');
  const [filterItem, setFilterItem]  = useState('Semua');
  const [activeTab, setActiveTab]    = useState('list');   // 'list' | 'history'
  const [delConfirm, setDelConfirm]  = useState(null);
  const [storeName, setStoreName]    = useState('');
  const [sessionRole, setSessionRole]= useState(''); // 'store'|'leader'|'admin'|''
  const [refreshTick, setRefreshTick]= useState(0);

  const showToast = (msg, type='ok') => setToast({ msg, type });
  const canEdit = mode === 'authenticated'; // publik = read-only

  // Cek session (hanya kalau bukan mode publik)
  useEffect(() => {
    if (mode === 'public') return;
    apiFetch('/api/me').then(d => {
      if (d.ok && d.session) {
        setSessionRole(d.session.role);
        if (!storeId && d.session.storeId) setStoreId(d.session.storeId);
        setStoreName(d.session.storeName || d.session.storeId || '');
      }
    }).catch(() => {});
  }, []);

  // Load entries
  useEffect(() => {
    if (!storeId) return;
    setLoading(true);
    setErr('');
    fetchEntries(storeId, mode === 'public' ? token : '')
      .then(d => { setEntries(d.entries || []); setLoading(false); })
      .catch(ex => { setErr(ex.message); setLoading(false); });
  }, [storeId, token, refreshTick]);

  // Auto-refresh tiap 60 detik (hemat bandwidth)
  useEffect(() => {
    const t = setInterval(() => setRefreshTick(x => x + 1), 60000);
    return () => clearInterval(t);
  }, []);

  // Lucide icons
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });

  // Filter entries
  const filtered = useMemo(() => {
    let list = [...entries];
    if (filterLoc !== 'Semua') list = list.filter(e => e.lokasi === filterLoc);
    if (filterItem !== 'Semua') list = list.filter(e => e.namaBarang === filterItem);
    return list;
  }, [entries, filterLoc, filterItem]);

  // History: semua entri diurutkan terbaru dulu
  const history = useMemo(() => [...entries].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [entries]);

  async function handleDelete(entry) {
    setDelConfirm(null);
    try {
      await deleteEntry(storeId, entry.id);
      showToast('Entri dihapus.');
      setRefreshTick(x => x + 1);
    } catch (ex) { showToast(ex.message, 'error'); }
  }

  function openAdd() { setEditEntry(null); setShowForm(true); }
  function openEdit(entry) {
    setEditEntry({
      namaBarang: entry.namaBarang, itemKey: entry.itemKey || '',
      lokasi: entry.lokasi, jumlah: String(entry.jumlah), satuan: entry.satuan,
      ed: entry.ed || '', entryId: entry.id,
    });
    setShowForm(true);
  }

  // Ringkasan per lokasi
  const summaryByLoc = useMemo(() => {
    const m = {};
    LOCATIONS.forEach(l => { m[l] = { count: 0, alerts: 0 }; });
    entries.forEach(e => {
      if (!m[e.lokasi]) m[e.lokasi] = { count: 0, alerts: 0 };
      m[e.lokasi].count++;
      if (isLowStock(e) || isExpiringSoon(e) || isExpired(e)) m[e.lokasi].alerts++;
    });
    return m;
  }, [entries]);

  // ── Render ──
  if (!storeId && mode === 'public') {
    return (
      <div className="min-h-screen flex items-center justify-center p-6">
        <div className="text-center space-y-2">
          <div className="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center mx-auto">
            <i data-lucide="package-x" className="w-7 h-7 text-slate-400"></i>
          </div>
          <p className="font-bold text-slate-700">Link tidak valid</p>
          <p className="text-sm text-slate-400">Minta link Investory yang benar dari admin toko Anda.</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 flex flex-col max-w-lg mx-auto">
      {/* Header */}
      <div className="bg-gradient-to-r from-purple-900 to-purple-700 text-white px-4 pt-10 pb-4">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-xs font-semibold text-purple-200 uppercase tracking-wider">Investory</p>
            <h1 className="font-display font-bold text-xl leading-tight">
              {storeName || storeId || 'Stok Freezer & Chiller'}
            </h1>
          </div>
          <div className="flex items-center gap-2">
            {mode === 'public' && (
              <span className="text-[10px] font-bold bg-white/15 rounded-full px-2 py-0.5">Baca saja</span>
            )}
            <button onClick={() => setRefreshTick(x => x + 1)} className="p-2 rounded-xl bg-white/15 hover:bg-white/25">
              <i data-lucide="refresh-cw" className="w-4 h-4"></i>
            </button>
          </div>
        </div>

        {/* Ringkasan lokasi */}
        <div className="mt-3 grid grid-cols-4 gap-1.5">
          {LOCATIONS.map(loc => {
            const s = summaryByLoc[loc] || { count: 0, alerts: 0 };
            return (
              <button key={loc} onClick={() => setFilterLoc(filterLoc === loc ? 'Semua' : loc)}
                className={`rounded-xl py-1.5 px-1 text-center transition-all ${filterLoc === loc ? 'bg-white text-purple-800' : 'bg-white/15 text-white'}`}>
                <p className="text-[9px] font-semibold leading-tight">{loc}</p>
                <p className="text-base font-bold leading-none mt-0.5">{s.count}</p>
                {s.alerts > 0 && <p className="text-[9px] text-amber-300 font-bold">⚠{s.alerts}</p>}
              </button>
            );
          })}
        </div>
      </div>

      {/* Tab nav */}
      <div className="bg-white border-b border-slate-200 flex">
        {[['list','Stok Sekarang','package'],['history','Riwayat','clock']].map(([tab, label, icon]) => (
          <button key={tab} onClick={() => setActiveTab(tab)}
            className={`flex-1 py-2.5 text-xs font-bold flex items-center justify-center gap-1.5 border-b-2 transition-all ${activeTab === tab ? 'border-purple-700 text-purple-800' : 'border-transparent text-slate-500'}`}>
            <i data-lucide={icon} className="w-3.5 h-3.5"></i>{label}
          </button>
        ))}
      </div>

      {/* Filter item */}
      <div className="bg-white px-3 py-2 border-b border-slate-100 overflow-x-auto">
        <div className="flex gap-1.5 min-w-max">
          {['Semua', ...ITEMS.map(i => i.label)].map(lbl => (
            <button key={lbl} onClick={() => setFilterItem(lbl)}
              className={`text-[10px] font-bold px-2.5 py-1 rounded-full transition-all whitespace-nowrap ${filterItem === lbl ? 'bg-purple-800 text-white' : 'bg-slate-100 text-slate-600'}`}>
              {lbl}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="flex-1 overflow-y-auto pb-24 px-4 pt-3 space-y-3">
        {loading && (
          <div className="space-y-3">
            {[1,2,3].map(n => <div key={n} className="skeleton h-20 w-full"></div>)}
          </div>
        )}

        {!loading && err && (
          <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-center space-y-2">
            <i data-lucide="wifi-off" className="w-8 h-8 text-rose-400 mx-auto"></i>
            <p className="text-sm font-semibold text-rose-700">{err}</p>
            <button onClick={() => setRefreshTick(x => x + 1)} className="text-xs text-rose-600 underline">Coba lagi</button>
          </div>
        )}

        {!loading && !err && activeTab === 'list' && (
          <React.Fragment>
            {/* Alert panel */}
            <AlertPanel entries={filtered} />

            {/* Entry list */}
            {filtered.length === 0 ? (
              <div className="text-center py-12 space-y-2">
                <i data-lucide="package-open" className="w-10 h-10 text-slate-300 mx-auto"></i>
                <p className="text-sm text-slate-400">Belum ada catatan stok{filterLoc !== 'Semua' ? ` di ${filterLoc}` : ''}.</p>
                {canEdit && <button onClick={openAdd} className="text-xs text-purple-700 font-bold underline">+ Tambah sekarang</button>}
              </div>
            ) : (
              filtered.map(e => (
                <EntryCard key={e.id} entry={e} canEdit={canEdit}
                  onEdit={openEdit} onDelete={entry => setDelConfirm(entry)} />
              ))
            )}
          </React.Fragment>
        )}

        {!loading && !err && activeTab === 'history' && (
          <React.Fragment>
            <p className="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Semua catatan — terbaru dulu</p>
            {history.length === 0 ? (
              <p className="text-sm text-slate-400 text-center py-10">Belum ada riwayat catatan.</p>
            ) : (
              history
                .filter(e => filterLoc === 'Semua' || e.lokasi === filterLoc)
                .filter(e => filterItem === 'Semua' || e.namaBarang === filterItem)
                .map(e => (
                  <div key={e.id} className="bg-white rounded-xl border border-slate-200 p-3 space-y-1 text-xs">
                    <div className="flex items-center justify-between gap-2">
                      <span className="font-bold text-slate-800">{e.namaBarang}</span>
                      <StatusBadge entry={e} />
                    </div>
                    <div className="flex gap-3 text-slate-600">
                      <span>{e.lokasi}</span>
                      <span>·</span>
                      <span className="font-semibold">{e.jumlah} {e.satuan}</span>
                      {e.ed && <span className="ml-auto text-slate-400">ED: {fmtDateShort(e.ed)}</span>}
                    </div>
                    <p className="text-[10px] text-slate-400">{fmtDate(e.updatedAt)}</p>
                  </div>
                ))
            )}
          </React.Fragment>
        )}
      </div>

      {/* FAB — tambah (hanya jika bisa edit) */}
      {canEdit && (
        <button onClick={openAdd}
          className="fixed bottom-6 right-4 z-30 bg-purple-800 hover:bg-purple-900 text-white w-14 h-14 rounded-2xl shadow-lg flex items-center justify-center">
          <i data-lucide="plus" className="w-6 h-6"></i>
        </button>
      )}

      {/* Form modal */}
      {showForm && (
        <EntryForm
          initial={editEntry}
          storeId={storeId}
          onSaved={() => { setShowForm(false); setRefreshTick(x => x+1); showToast('Catatan tersimpan! ✅'); }}
          onCancel={() => setShowForm(false)}
        />
      )}

      {/* Konfirmasi hapus */}
      {delConfirm && (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-5 animate-fadeIn">
          <div className="bg-white rounded-2xl p-5 w-full max-w-xs space-y-3 animate-scaleIn">
            <h3 className="font-bold text-slate-800">Hapus Catatan?</h3>
            <p className="text-sm text-slate-500">
              <b>{delConfirm.namaBarang}</b> ({delConfirm.lokasi}, {delConfirm.jumlah} {delConfirm.satuan}) akan dihapus permanen.
            </p>
            <div className="flex gap-2">
              <button onClick={() => setDelConfirm(null)} className="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-xl text-sm">Batal</button>
              <button onClick={() => handleDelete(delConfirm)} className="flex-1 bg-rose-600 text-white font-bold py-2.5 rounded-xl text-sm">Hapus</button>
            </div>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && <Toast msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
