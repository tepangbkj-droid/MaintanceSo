<script>
  // ==========================================
  // FIX: konflik lucide.createIcons() vs React DOM reconciliation
  // (SAMA seperti perbaikan di index.html -- halaman ini juga memakai
  // scheduleLucideIcons()/lucide.createIcons() di useEffect tiap render,
  // jadi rentan bug yang sama persis: React mencoba removeChild/insertBefore
  // elemen <i data-lucide> yang SUDAH diganti Lucide jadi <svg> di luar
  // sepengetahuan React, browser melempar NotFoundError, dan karena
  // sebelumnya TIDAK ada ErrorBoundary di halaman ini, error tsb membuat
  // SELURUH render React gagal -- hasilnya layar putih kosong total.
  // Patch ini membuat removeChild/insertBefore "defensif": kalau node yang
  // diminta dihapus/disisipkan ternyata bukan child dari parent tsb, jangan
  // lempar error, cukup diam saja. Tidak mengubah tampilan apa pun yang
  // terlihat pengguna -- hanya mencegah crash akibat DOM sudah berubah duluan.
  // ==========================================
  (function () {
    const origRemoveChild = Node.prototype.removeChild;
    Node.prototype.removeChild = function (child) {
      if (child.parentNode !== this) {
        if (console && console.warn) {
          console.warn('[Psikotes] Diabaikan: removeChild pada node yang sudah tidak jadi child (biasanya akibat lucide.createIcons()).', child);
        }
        return child;
      }
      return origRemoveChild.call(this, child);
    };

    const origInsertBefore = Node.prototype.insertBefore;
    Node.prototype.insertBefore = function (newNode, refNode) {
      if (refNode && refNode.parentNode !== this) {
        if (console && console.warn) {
          console.warn('[Psikotes] Diabaikan: insertBefore dengan referenceNode yang sudah tidak jadi child (biasanya akibat lucide.createIcons()).', refNode);
        }
        return this.appendChild(newNode);
      }
      return origInsertBefore.call(this, newNode, refNode);
    };
  })();
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ==========================================
// KONEKSI KE CLOUDFLARE WORKER (backend yang sama dengan index.html)
// ==========================================
const WORKER_BASE = (/(^|\.)somandiritarobun\.my\.id$/.test(location.hostname) ? 'https://api.somandiritarobun.my.id' : 'https://tarobun-api.tepangbkj8.workers.dev');

let _lucideScheduled = false;
const scheduleLucideIcons = () => {
  if (_lucideScheduled) return;
  _lucideScheduled = true;
  requestAnimationFrame(() => {
    _lucideScheduled = false;
    if (window.lucide) window.lucide.createIcons();
  });
};


// ==========================================
// Cloudflare Turnstile (anti-bot saat MULAI psikotes) — aktif hanya jika Worker punya TURNSTILE_SITEKEY & TURNSTILE_SECRET.
// Widget "interaction-only": peserta biasanya tidak melihat apa-apa; tantangan baru muncul bila perangkat dicurigai bot.
// ==========================================
let _tsCfg = null, _tsLoad = null;
const tsSiteKey = async () => {
  if (_tsCfg !== null) return _tsCfg;
  try {
    const r = await fetch(`${WORKER_BASE}/api/turnstile/config`);
    const d = r.ok ? await r.json() : {};
    _tsCfg = d.siteKey || '';
  } catch (e) { return ''; } // gagal sesaat: jangan di-cache, coba lagi nanti
  return _tsCfg;
};
const tsToken = async () => {
  const key = await tsSiteKey();
  if (!key) return null;
  try {
    if (!_tsLoad) _tsLoad = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; sc.async = true; sc.onload = res; sc.onerror = () => { _tsLoad = null; rej(new Error('ts')); }; document.head.appendChild(sc); });
    await _tsLoad;
    return await new Promise((resolve) => {
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:100000';
      document.body.appendChild(box);
      let id = null;
      const done = (t) => { try { window.turnstile.remove(id); } catch (e) {} box.remove(); resolve(t); };
      const to = setTimeout(() => done(null), 20000);
      id = window.turnstile.render(box, { sitekey: key, appearance: 'interaction-only', callback: (t) => { clearTimeout(to); done(t); }, 'error-callback': () => { clearTimeout(to); done(null); } });
    });
  } catch (e) { return null; }
};

// ==========================================
// HALAMAN PUBLIK: Psikotes OJT (dibuka lewat link, TANPA login)
// ==========================================
// Alur: form Nama+Penempatan (link umum, ?psikotes=) ATAU konfirmasi nama+toko yang sudah
// ditentukan admin (link per-OJT, ?ojt=) -> kerjakan soal satu-satu -> selesai.
// Anti-keluar: kalau tab/app di-minimize atau pindah tab saat status 'taking', langsung
// dilaporkan ke server (flag-leave) dan attempt ditandai 'blocked'.
// PERBAIKAN INPUT/KEYBOARD (penting): komponen ini SEBELUMNYA didefinisikan DI DALAM
// PsikotesOjtPublicPage (dibuat ulang setiap render). Karena React menganggap komponen
// yang "dibuat ulang" itu sebagai TIPE BARU, seluruh isi <Shell> (termasuk input Nama &
// Lokasi Penempatan) ikut di-unmount+mount ulang SETIAP KALI state berubah -- termasuk
// setiap kali user mengetik satu huruf. Akibatnya input kehilangan fokus dan keyboard HP
// otomatis tertutup setelah tiap huruf, harus dibuka lagi manual. Dipindah jadi komponen
// tingkat-atas (stabil, tidak dibuat ulang) supaya fokus/keyboard tetap terjaga saat mengetik.
function BrandMark({ size = 40 }) {
  return (
    <span style={{ width: size, height: size }} className="shrink-0 rounded-2xl bg-white/95 flex items-center justify-center shadow-md">
      <svg width={size * 0.58} height={size * 0.58} viewBox="0 0 24 24" fill="none" stroke="#5b21b6" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <rect x="5" y="3.5" width="14" height="17" rx="3" />
        <path d="M9 3.5h6v2.2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z" fill="#ddd6fe" />
        <path d="m8.8 13.2 2.2 2.2 4.2-4.6" />
      </svg>
    </span>
  );
}
function BrandHeader() {
  return (
    <header className="pk-header">
      <div className="max-w-md mx-auto w-full flex items-center gap-3 px-4 py-3.5">
        <BrandMark />
        <div className="leading-tight">
          <p className="font-display font-extrabold text-[17px] text-white tracking-tight">Psikotes</p>
          <p className="text-[11px] text-violet-200 font-semibold tracking-[0.14em] uppercase">By So Mandiri</p>
        </div>
        <span className="pk-secure ml-auto">🔒 Mode Aman</span>
      </div>
    </header>
  );
}
function Shell({ children }) {
  return (
    <div className="pk-bg min-h-screen flex flex-col">
      <BrandHeader />
      <main className="flex-1 flex items-start justify-center px-4 pt-6 pb-8">
        <div className="w-full max-w-md pk-rise">{children}</div>
      </main>
      <footer className="pk-foot">Psikotes By So Mandiri · Kerjakan dengan jujur &amp; tenang 💜</footer>
    </div>
  );
}
// Kartu status satu layar (error / terkunci / diblokir / selesai).
function StateCard({ tone, icon, title, children, extra }) {
  return (
    <div className="pk-card p-7 text-center space-y-3">
      <div className={`pk-hero-icon ${tone ? 'pk-tone-' + tone : ''}`}><i data-lucide={icon} className="w-7 h-7"></i></div>
      <h2 className="font-display font-extrabold text-slate-900 text-xl tracking-tight">{title}</h2>
      <div className="text-sm text-slate-500 leading-relaxed">{children}</div>
      {extra}
    </div>
  );
}
// Kolom token akses (dari Store Leader/admin, berlaku 30 menit).
function TokenField({ value, onChange }) {
  return (
    <div className="rounded-2xl border-2 border-dashed border-violet-200 bg-violet-50/50 p-4 space-y-2">
      <label className="pk-label flex items-center gap-1.5" htmlFor="pk-token">🔑 Token Tes</label>
      <input id="pk-token" value={value} onChange={e => onChange(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8))}
        inputMode="text" autoCapitalize="characters" autoComplete="off" autoCorrect="off" spellCheck={false} maxLength={8}
        className="pk-input text-center font-mono font-extrabold tracking-[0.4em] text-xl" placeholder="••••••" />
      <p className="text-[11px] text-violet-700 leading-snug">Minta token ke Store Leader/admin. Token berubah dan hanya berlaku sekitar 30 menit.</p>
    </div>
  );
}

function TestHero({ test, step, total }) {
  return (
    <div className="text-center space-y-2">
      <div className="pk-hero-icon"><i data-lucide="clipboard-list" className="w-7 h-7"></i></div>
      <p className="text-[11px] font-bold tracking-[0.16em] uppercase text-violet-500">Psikotes OJT</p>
      <h2 className="font-display font-extrabold text-slate-900 text-[22px] leading-tight tracking-tight">{test?.title}</h2>
      {test?.description && <p className="text-[13px] text-slate-500 leading-relaxed">{test.description}</p>}
      <div className="flex items-center justify-center gap-2 pt-1">
        {test?.timer_minutes ? <span className="pk-chip">⏱ {test.timer_minutes} menit</span> : null}
        <span className="pk-chip">📝 Sekali kerja</span>
      </div>
      {step ? <div className="pk-steps pt-1"><i className="on"></i><i className={step >= 2 ? 'on' : ''}></i><i className={step >= 3 ? 'on' : ''}></i></div> : null}
    </div>
  );
}

// ==========================================================================
// PsikotesGuard (2026-10): pengaman best-effort saat psikotes berlangsung.
// Yang BISA dilakukan web: alarm sirene (volume pemutar dipaksa 100%) + getar saat keluar
// halaman/kehilangan fokus, layar dijaga tetap menyala, mode layar penuh.
// Yang TIDAK bisa dilakukan web: memblokir notifikasi, mendeteksi aplikasi ngambang secara
// langsung, atau mengunci volume SISTEM HP. Itu dijaga lewat deklarasi peserta + deteksi perilaku.
// ==========================================================================
// Jembatan ke plugin native "PsikotesGuard" (hanya ada kalau halaman dibuka di APK Tarobun terbaru).
// Native: deteksi aplikasi ngambang, blok notifikasi (Jangan Ganggu), alarm yang tetap bunyi di latar belakang.
const NativeGuard = (() => {
  const get = () => {
    try {
      const C = window.Capacitor;

const PsikotesGuard = (() => {
  let siren = null, ringing = false, armed = false, fsEntered = false;
  let enforceTimer = null, vibTimer = null, titleTimer = null, wakeLock = null;
  const baseTitle = document.title;

  function buildSirenUrl() {
    const rate = 16000, secs = 2, n = rate * secs;
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    let ph = 0;
    for (let i = 0; i < n; i++) {
      const t = i / rate;
      const f = 1100 + 500 * Math.sin(2 * Math.PI * 2 * t); // sapuan nada naik-turun 2x/detik
      ph += 2 * Math.PI * f / rate;
      const x = Math.max(-1, Math.min(1, Math.sin(ph) * 1.8)); // dipadatkan -> lebih nyaring
      v.setInt16(44 + i * 2, Math.round(x * 32000), true);
    }

  }

  async function acquireWakeLock() {
    try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
  }

  // WAJIB dipanggil dari dalam tap/klik pengguna (syarat autoplay audio & fullscreen).
  function arm() {
    if (NativeGuard.available()) { armed = true; return; } // di APK: alarm/layar dijaga native
    try {
      if (!siren) {
        siren = new Audio(buildSirenUrl());
        siren.loop = true; siren.preload = 'auto';
        siren.setAttribute('playsinline', '');
        siren.addEventListener('volumechange', () => { if (ringing && (siren.volume < 1 || siren.muted)) { siren.muted = false; siren.volume = 1; } });
      }
      // "Buka kunci" elemen audio: setelah ini browser mengizinkan play() otomatis saat pelanggaran.
      siren.muted = true;
      const pr = siren.play();
      if (pr && pr.then) pr.then(() => { siren.pause(); siren.currentTime = 0; siren.muted = false; }).catch(() => { siren.muted = false; });
    } catch (e) {}
    try {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.then) r.then(() => { fsEntered = true; }).catch(() => {}); }
    } catch (e) {}
    acquireWakeLock();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && armed) acquireWakeLock(); });
    armed = true;
  }

  function startAlarm() {
    if (ringing || !siren) return;
    ringing = true;
    const tick = () => {
      if (!ringing) return;
      try { siren.muted = false; siren.volume = 1; if (siren.paused) siren.play().catch(() => {}); } catch (e) {}
    };
    try { siren.currentTime = 0; } catch (e) {}
    tick();
    enforceTimer = setInterval(tick, 400);
    const buzz = () => { try { navigator.vibrate && navigator.vibrate([700, 150, 700, 150, 700]); } catch (e) {} };
    buzz(); vibTimer = setInterval(buzz, 2600);
    let on = false;
    titleTimer = setInterval(() => { on = !on; document.title = on ? '⚠️ KEMBALI KE PSIKOTES!' : baseTitle; }, 800);
  }

  function stopAlarm() {
    if (!ringing) return;
    ringing = false;
    clearInterval(enforceTimer); clearInterval(vibTimer); clearInterval(titleTimer);
    try { siren.pause(); siren.currentTime = 0; } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(0); } catch (e) {}
    document.title = baseTitle;
  }

  function reenterFullscreen() {
    try { const el = document.documentElement; const req = el.requestFullscreen || el.webkitRequestFullscreen; if (req) req.call(el, { navigationUI: 'hide' }); } catch (e) {}
  }

  function release() {
    natCall('end');
    stopAlarm();
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
    try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}

  }

      if (allowFloating || !isTouch || native) return; // di APK, split-screen sudah dilarang di manifest
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (window.innerWidth < window.screen.width * 0.85) flag('resize'); }, 600);
    };
    const onFs = () => { if (PsikotesGuard.fullscreenWasEntered() && !document.fullscreenElement) setFsLost(true); else setFsLost(false); };
    document.addEventListener('visibilitychange', onVisibility);
    document.addEventListener('fullscreenchange', onFs);
    window.addEventListener('pagehide', onPageHide);
    window.addEventListener('blur', onBlur);
    window.addEventListener('focus', onFocus);
    window.addEventListener('resize', onResize);
    // APK: native yang mendeteksi (overlay/fokus/keluar). JS hanya menarik statusnya (juga jadi detak jantung watchdog native).
    let natIv = null;
    const onFocusIn = (e) => { if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) natCall('setImeActive', { active: true }); };
    const onFocusOut = () => { natCall('setImeActive', { active: false }); };
    if (native) {
      document.addEventListener('focusin', onFocusIn);
      document.addEventListener('focusout', onFocusOut);
      natIv = setInterval(async () => {
        const st = await natCall('getStatus');
        if (st && st.violation) flag(st.violation, true);
      }, 700);
    }
    return () => {
      clearInterval(natIv);
      document.removeEventListener('focusin', onFocusIn);
      document.removeEventListener('focusout', onFocusOut);
      clearTimeout(blurTimer); clearTimeout(resizeTimer);
      document.removeEventListener('visibilitychange', onVisibility);
      document.removeEventListener('fullscreenchange', onFs);
      window.removeEventListener('pagehide', onPageHide);
      window.removeEventListener('blur', onBlur);
      window.removeEventListener('focus', onFocus);
      window.removeEventListener('resize', onResize);
    };
  }, [phase, attempt, armedUi, allowFloating, native]);

  // Alarm berhenti begitu peserta kembali ke halaman ini (terlihat + fokus).
  useEffect(() => {
    if (phase !== 'blocked') return;
    const check = () => { if (!document.hidden && document.hasFocus()) PsikotesGuard.stopAlarm(); };
    document.addEventListener('visibilitychange', check);
    window.addEventListener('focus', check);
    const iv = setInterval(check, 500);
    check();
    return () => { document.removeEventListener('visibilitychange', check); window.removeEventListener('focus', check); clearInterval(iv); };

  useEffect(() => { if (phase === 'done') PsikotesGuard.release(); }, [phase]);

  useEffect(() => {
    if (phase !== 'blocked' || !attempt) return;
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/status`, { headers: { 'X-Attempt-Secret': attempt.attemptSecret } });
        const data = await res.json();
        if (res.ok && data.status === 'in_progress') { if (await restoreSession(attempt)) setPhase('taking'); }
      } catch (e) { /* diamkan, coba lagi di interval berikutnya */ }
    }, 5000);
    return () => clearInterval(interval);
  }, [phase, attempt]);

  const sendAnswer = async (questionId, value) => {
    if (!attempt) return false;
    try {
      const res = await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/answer`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attemptSecret: attempt.attemptSecret, questionId, answer: value }),
      });
      if (res.ok) { syncedRef.current[questionId] = value; return true; }
      if (res.status === 409) { const d = await res.json().catch(() => ({})); if (d && d.expired) setTimerSeconds(0); }
    } catch (e) { /* offline: jawaban tetap aman di perangkat, dikirim ulang saat online/kumpulkan */ }
    return false;
  };
  // Kirim semua jawaban yang belum terkonfirmasi (dipakai sebelum Kumpulkan & saat online lagi).
  const syncAll = async () => {
    const cur = answersRef.current || {};
    for (const qq of questions) {
      const v = cur[qq.id];
      if (v !== undefined && String(v).trim() !== '' && syncedRef.current[qq.id] !== v) await sendAnswer(qq.id, v);
    }
  };
  // Esai di-debounce supaya tidak mengirim 1 request per ketikan (hemat D1/Worker); pilihan ganda langsung.
  const flushPending = () => {
    const p = pendingRef.current; pendingRef.current = {};
    Object.keys(p).forEach(qid => { clearTimeout(p[qid].t); sendAnswer(qid, p[qid].v); });
  };
  const saveAnswer = (questionId, value, opts) => {
    setAnswers(prev => {
      const next = { ...prev, [questionId]: value };
      writeLocalProgress({ answers: next });
      return next;
    });
    if (opts && opts.debounce) {
      const old = pendingRef.current[questionId];
      if (old) clearTimeout(old.t);
      pendingRef.current[questionId] = { v: value, t: setTimeout(() => {
        const cur = pendingRef.current[questionId];
        if (cur) { delete pendingRef.current[questionId]; sendAnswer(questionId, cur.v); }
      }, 900) };
    } else {
      sendAnswer(questionId, value);
    }
  };

  const handleFinish = async () => {
    setSaving(true);
    try {
      flushPending();
      await syncAll();
      const res = await fetch(`${WORKER_BASE}/api/psikotes/public/attempt/${attempt.attemptId}/finish`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attemptSecret: attempt.attemptSecret }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.removeItem(storageKey);
        localStorage.removeItem(progressKey);
        setNavOpen(false);
        setPhase('done');
      } else {
        setErrorMsg(data.error || 'Gagal mengumpulkan jawaban');
      }
    } catch (e) {
      setErrorMsg('Gagal mengumpulkan jawaban. Periksa koneksi internet lalu coba lagi.');
    } finally {

  const NativeStatusBox = () => {

  const appIntentUrl = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.tarobun.app;S.browser_fallback_url=${encodeURIComponent(location.origin + '/apk/tarobun.apk')};end`;
  const SecurityChecklist = () => (

      {allowFloating ? (

        </label>

      {native ? NativeStatusBox() : (
        <React.Fragment>
          <label className="flex items-start gap-2 text-[11px] text-slate-700">

        <div className="pt-1">

  if (phase === 'loading') {
    return <Shell><div className="pk-card p-10 text-center text-slate-500 space-y-3">

      extra={<div className="pk-note pk-note-violet">Hasil tidak ditampilkan di sini. Store Leader akan meninjau dan menyampaikannya padamu.</div>}>

    return <Shell><div className="pk-card p-6 space-y-5">
      <TestHero test={test} step={2} />
      {isRemedial && <div className="pk-note pk-note-violet"><strong>🔁 Remedial dibuka.</strong> Kamu mendapat kesempatan mengerjakan tes ini sekali lagi. Skor lama tersimpan sebagai riwayat.</div>}
      <div className="rounded-2xl bg-violet-50/60 border border-violet-100 p-4 space-y-2">

      <button onClick={handleStart} disabled={submittingStart || !checklistOk || (tokenRequired && accessToken.length < 6)} className="pk-btn">

      </button>
    </div></Shell>;
  }
  if (phase === 'form') {
    return <Shell><div className="pk-card p-6 space-y-5">
      <TestHero test={test} step={1} />
      {isRemedial && <div className="pk-note pk-note-violet"><strong>🔁 Remedial dibuka.</strong> Isi nama yang sama seperti sebelumnya untuk mengerjakan ulang tes ini.</div>}
      <div className="pk-note pk-note-blue">

      </div>
      <div>
        <label className="pk-label" htmlFor="pk-name">Nama Lengkap</label>
        <input id="pk-name" autoComplete="name" value={name} onChange={e => setName(e.target.value)} className="pk-input" placeholder="Nama asli kamu" />
      </div>
      <div ref={storeDropdownRef} className="relative">
        <label className="pk-label">Lokasi Penempatan</label>
        <button type="button" disabled={dirLoading} onClick={() => setStoreDropdownOpen(o => !o)}
          className="pk-input flex items-center justify-between gap-2 text-left disabled:opacity-60">
          <span className={`truncate ${penempatan ? 'text-slate-900' : 'text-slate-400'}`}>
            {dirLoading ? 'Memuat daftar toko...' : (penempatan || (storeDirectory.length === 0 ? 'Pilih toko/outlet' : '-- Pilih Toko/Outlet --'))}
          </span>
          <i data-lucide="chevron-down" className={`w-4 h-4 text-slate-400 shrink-0 transition-transform ${storeDropdownOpen ? 'rotate-180' : ''}`}></i>
        </button>
        {storeDropdownOpen && !dirLoading && storeDirectory.length > 0 && (
          <div className="absolute z-30 mt-1.5 w-full bg-white border border-violet-100 rounded-2xl shadow-xl animate-fadeIn overflow-hidden">
            {storeDirectory.length > 4 && (
              <div className="p-2 border-b border-slate-100">
                <div className="relative">
                  <i data-lucide="search" className="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                  <input type="text" autoFocus value={storeSearchQuery} onChange={e => setStoreSearchQuery(e.target.value)}
                    placeholder="Cari nama toko/outlet..." className="w-full pl-8 pr-2.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-violet-500" />
                </div>

            )}
            <ul className="max-h-[200px] overflow-y-auto py-1 overscroll-contain">
              {filteredStoreDirectory.length === 0 && (
                <li className="px-3 py-2.5 text-xs text-slate-400 text-center">Tidak ada toko yang cocok dengan "{storeSearchQuery}".</li>
              )}
              {filteredStoreDirectory.map(s => (
                <li key={s.id}>
                  <button type="button" onClick={() => { setPenempatan(s.name); setStoreDropdownOpen(false); setStoreSearchQuery(''); }}
                    className={`w-full text-left px-4 py-2.5 text-sm truncate ${penempatan === s.name ? 'bg-violet-50 text-violet-800 font-bold' : 'text-slate-700 hover:bg-slate-50'}`}>
                    {s.name}
                  </button>
                </li>
              ))}
            </ul>
          </div>
        )}
        {!dirLoading && storeDirectory.length === 0 && (
          <input value={penempatan} onChange={e => setPenempatan(e.target.value)} className="pk-input" placeholder="Contoh: Toko Cabang A" />
        )}
        {dirError && <p className="text-[11px] text-amber-600 mt-1">Gagal memuat daftar toko dari server. Kamu masih bisa ketik nama toko secara manual di atas.</p>}
      </div>
      {tokenRequired && <TokenField value={accessToken} onChange={setAccessToken} />}
      {SecurityChecklist()}
      {errorMsg && <p className="text-xs text-rose-600 font-semibold">{errorMsg}</p>}
      <button onClick={handleStart} disabled={submittingStart || !name.trim() || !penempatan.trim() || !checklistOk || (tokenRequired && accessToken.length < 6)} className="pk-btn">
        {submittingStart ? 'Memulai…' : (isRemedial ? 'Mulai Remedial' : 'Mulai Psikotes')}
      </button>
    </div></Shell>;
  }
  // ✅ PERBAIKAN: Tambah if statement yang hilang!
  if (phase === 'taking' && questions.length === 0) {
    return <Shell><div className="pk-card p-8 text-center space-y-4">
      <i data-lucide="loader" className="w-8 h-8 animate-spin mx-auto text-violet-600"></i>
      <p className="text-sm text-slate-500 font-semibold">Memuat soal…</p>
      <button onClick={async () => { if (!(await restoreSession(attempt))) setPhase('blocked'); }} className="pk-btn">Muat Ulang Soal</button>

  }
  if (phase === 'taking' && !armedUi) {
    return <Shell><div className="pk-card p-7 space-y-4 text-center">
      <div className="pk-hero-icon"><i data-lucide="shield-check" className="w-7 h-7"></i></div>
      <h2 className="font-display font-extrabold text-slate-900 text-xl">Lanjutkan Psikotes</h2>
      <p className="text-sm text-slate-500 leading-relaxed">Pastikan aplikasi ngambang sudah ditutup dan notifikasi dimatikan. Jika keluar halaman, alarm akan berbunyi dan akses diblokir.</p>
      {native && NativeStatusBox()}
      {errorMsg && <p className="text-xs text-rose-600">{errorMsg}</p>}
      <button disabled={native && !(nativeSt && nativeSt.dndGranted)} onClick={async () => {
        if (native) {
          const st = await natCall('precheck');
          if (st && st.overlay && !allowFloating) { setErrorMsg('Terdeteksi aplikasi ngambang di atas layar. Tutup dulu, atau minta izin Store Leader.'); return; }
          if (st && !st.dndGranted) { setErrorMsg('Izin "Jangan Ganggu" belum diberikan.'); return; }
          setErrorMsg('');
        }
        PsikotesGuard.arm();
        armedRef.current = true;
        setArmedUi(true);
        if (native && attempt) await nativeBegin(attempt, allowFloating);
      }} className="pk-btn">Lanjutkan Mengerjakan</button>
    </div></Shell>;
  }
  if (phase === 'taking') {
    const q = questions[qIndex];
    const isAns = (qq) => { const v = answers[qq.id]; return v !== undefined && v !== null && String(v).trim() !== ''; };
    const answeredCount = questions.filter(isAns).length;
    const allAnswered = answeredCount === questions.length;
    const missing = questions.map((qq, i) => (isAns(qq) ? 0 : i + 1)).filter(Boolean);
    // cur = sedang dibuka | ans = sudah dijawab | skip = pernah dibuka tapi belum dijawab (dilewati) | todo = belum dibuka
    const stateOf = (qq, i) => (i === qIndex ? 'cur' : isAns(qq) ? 'ans' : visited[qq.id] ? 'skip' : 'todo');
    const preview = (qq) => {
      if (!isAns(qq)) return null;
      const v = answers[qq.id];
      if (qq.type === 'pilihan_ganda') { const idx = Number(v); return { tag: String.fromCharCode(65 + idx), text: (qq.options || [])[idx] || '' }; }
      const t = String(v).replace(/\s+/g, ' ').trim();
      return { tag: '✎', text: t.length > 80 ? t.slice(0, 80) + '…' : t };
    };
    const goTo = (i) => { flushPending(); setQIndex(i); setNavOpen(false); try { window.scrollTo(0, 0); } catch (e) {} };
    const shortText = (t) => { const x = String(t || '').replace(/\s+/g, ' ').trim(); return x.length > 60 ? x.slice(0, 60) + '…' : x; };
    return (
      <div className="pk-bg min-h-screen p-4 pt-3">

                          <span className="qnav-q">{shortText(qq.text)}</span>
                          {pv
                            ? <span className="qnav-a"><b>{pv.tag}</b> {pv.text}</span>
                            : <span className="qnav-a qnav-none">{visited[qq.id] ? 'Dilewati — belum dijawab' : 'Belum dijawab'}</span>}
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ul>
              {allAnswered ? (
                <button onClick={handleFinish} disabled={saving} className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold py-3 rounded-xl text-sm">
                  {saving ? 'Mengirim...' : 'Kumpulkan Jawaban'}
                </button>
              ) : (
                <p className="qnav-warn">Belum dijawab: no. {missing.join(', ')}</p>
              )}
            </div>
          </div>
        )}

        <div className="max-w-md mx-auto space-y-4">
          <div className="flex items-center gap-2.5 px-1">
            <BrandMark size={30} />
            <p className="font-display font-extrabold text-[15px] text-violet-950 leading-none">Psikotes <span className="text-[10px] font-bold tracking-[0.14em] uppercase text-violet-500 ml-1">By So Mandiri</span></p>
          </div>
          <div className="pk-card p-4 sticky top-3 z-10">
            <div className="flex items-center justify-between text-xs text-slate-500 mb-2">
              <span className="pk-qnum">Soal {qIndex + 1} <span className="opacity-60">/ {questions.length}</span></span>
              <div className="flex items-center gap-3">
                {timerSeconds !== null && (
                  <span className={`pk-timer ${timerSeconds <= 60 ? 'danger' : timerSeconds <= 300 ? 'warn' : ''}`}>
                    ⏱ {String(Math.floor(timerSeconds / 60)).padStart(2, '0')}:{String(timerSeconds % 60).padStart(2, '0')}
                  </span>
                )}
                <button onClick={() => { flushPending(); setNavOpen(true); }} className="qnav-open">Daftar Soal · {answeredCount}/{questions.length}</button>
              </div>
            </div>
            <div className="pk-bar">
              <div style={{ width: `${(answeredCount / questions.length) * 100}%` }}></div>
            </div>
            <div className="qnav-strip">
              {questions.map((qq, i) => (
                <button key={qq.id} className={`qnav-n qnav-${stateOf(qq, i)}`} onClick={() => goTo(i)} aria-label={`Soal ${i + 1}`}>{i + 1}</button>
              ))}
            </div>
          </div>

          {q && (
            <div className="pk-card p-5 space-y-4">
              <p className="font-semibold text-slate-900 text-[15px] leading-relaxed whitespace-pre-wrap">{q.text}</p>
              {q.image_url && (
                <img src={`${WORKER_BASE}/api/media/file/${q.image_url}`} alt="Gambar soal" className="w-full rounded-xl border border-slate-200 object-contain max-h-64" />
              )}
              {q.type === 'pilihan_ganda' ? (
                <div className="space-y-2">
                  {q.options.map((opt, i) => (
                    <button key={i} onClick={() => saveAnswer(q.id, String(i))}
                      className={`pk-opt ${String(answers[q.id]) === String(i) ? 'sel' : ''}`}>
                      <span className="pk-key">{String.fromCharCode(65 + i)}</span><span className="pt-0.5">{opt}</span>
                    </button>
                  ))}
                  {isAns(q) && (
                    <button onClick={() => saveAnswer(q.id, '')} className="qnav-clear">Hapus jawaban nomor ini</button>
                  )}
                </div>
              ) : (
                <textarea value={answers[q.id] || ''} onChange={e => saveAnswer(q.id, e.target.value, { debounce: true })} onBlur={flushPending} rows={4}
                  className="pk-input" placeholder="Tulis jawabanmu di sini..." />
              )}
            </div>
          )}

          <div className="flex gap-2">
            <button onClick={() => goTo(Math.max(0, qIndex - 1))} disabled={qIndex === 0}
              className="pk-btn pk-btn-ghost disabled:opacity-40" style={{ flex: 1 }}>← Sebelumnya</button>
            {qIndex < questions.length - 1 ? (
              <button onClick={() => goTo(Math.min(questions.length - 1, qIndex + 1))}
                className="pk-btn" style={{ flex: 1 }}>Selanjutnya →</button>
            ) : (
              <button onClick={handleFinish} disabled={saving || !allAnswered}
                className="pk-btn pk-btn-green" style={{ flex: 1 }}>
                {saving ? 'Mengirim...' : 'Kumpulkan Jawaban ✓'}
              </button>
            )}
          </div>
          {errorMsg && <p className="text-xs text-center text-rose-600">{errorMsg}</p>}
          {!allAnswered && qIndex === questions.length - 1 && (
            <div className="qnav-missing">
              <p>Masih ada {missing.length} soal belum dijawab. Ketuk nomornya untuk kembali ke soal itu:</p>
              <div>
                {missing.map(n => (
                  <button key={n} className="qnav-n qnav-skip" onClick={() => goTo(n - 1)}>{n}</button>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const ojtToken = params.get('ojt');
  const psikotesToken = params.get('psikotes');

  if (ojtToken) return <PsikotesOjtPublicPage linkToken={ojtToken} assigned={true} />;
  if (psikotesToken) return <PsikotesOjtPublicPage linkToken={psikotesToken} assigned={false} />;

  return (
    <div className="min-h-screen bg-gradient-to-br from-purple-50 via-white to-indigo-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 text-center space-y-2 max-w-md">
        <i data-lucide="link-2-off" className="w-10 h-10 text-slate-400 mx-auto"></i>
        <h2 className="font-bold text-slate-800">Link Tidak Lengkap</h2>
        <p className="text-sm text-slate-500">Buka halaman ini menggunakan link psikotes yang dibagikan admin/toko.</p>
      </div>
    </div>
  );
}

// ==========================================
// ErrorBoundary (SAMA seperti index.html): jaring pengaman terakhir.
// Kalau ada error React yang lolos dari patch removeChild/insertBefore di
// atas (atau sebab lain), tanpa ini layar akan putih kosong tanpa keterangan
// apa pun. Dengan ini, error tertangkap dan pengguna melihat pesan jelas +
// tombol "Muat Ulang" -- bukan halaman kosong yang membingungkan.
// ==========================================
class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, errorInfo: '', errorStack: '', showDetail: false };
  }
  static getDerivedStateFromError(error) {
    return {
      hasError: true,
      errorInfo: (error && error.message) ? error.message : String(error),
      errorStack: (error && error.stack) ? error.stack : '',
    };
  }
  componentDidCatch(error, info) {
    console.error('Psikotes App Error (ditangkap ErrorBoundary):', error, info);
  }
  handleReload = () => {
    this.setState({ hasError: false, errorInfo: '', errorStack: '', showDetail: false });
    window.location.reload();
  };
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 via-white to-indigo-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 max-w-sm w-full text-center space-y-3">
            <div className="w-14 h-14 rounded-full bg-rose-50 flex items-center justify-center mx-auto">
              <i data-lucide="alert-triangle" className="w-7 h-7 text-rose-500"></i>
            </div>
            <h2 className="font-bold text-slate-800 text-lg">Ups, terjadi kendala tampilan</h2>
            <p className="text-xs text-slate-500">Silakan muat ulang halaman untuk melanjutkan.</p>
            <button
              onClick={this.handleReload}
              className="w-full bg-purple-800 hover:bg-purple-900 text-white font-bold py-2.5 rounded-xl text-sm"
            >
              Muat Ulang Halaman
            </button>
            <button
              type="button"
              onClick={() => this.setState(s => ({ showDetail: !s.showDetail }))}
              className="text-[10px] text-slate-400 underline"
            >
              {this.state.showDetail ? 'Sembunyikan detail teknis' : 'Lihat detail teknis'}
            </button>
            {this.state.showDetail && (
              <pre className="text-left text-[9px] text-rose-600 bg-rose-50 rounded-lg p-2 max-h-32 overflow-auto whitespace-pre-wrap break-words">{this.state.errorInfo}{this.state.errorStack ? '\n' + this.state.errorStack : ''}</pre>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

window.addEventListener('unhandledrejection', (event) => {
  console.error('Psikotes App - Promise ditolak tanpa ditangani:', event.reason);
});

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
window.addEventListener('load', () => { if (window.lucide) window.lucide.createIcons(); });
</script>
</body>
</html>
